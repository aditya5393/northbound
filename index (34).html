<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NorthBound Trips - Tour Management & Operations</title>
  <meta name="theme-color" content="#0c101c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #0c101c;
      --card: rgba(22, 32, 56, 0.88);
      --card-solid: #162038;
      --tx: #ffffff;
      --mut: #91a2bf;
      --line: rgba(255, 255, 255, 0.12);
      --cy: #00f2d5;
      --bl: #3898ff;
      --gr: #2ed573;
      --rd: #ff4757;
      --am: #ffa502;
      --pu: #9b51e0;
      --ac: #00f2d5;
      --ac2: #3898ff;
      --gx: 50%;
      --gy: 25%;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #gemini-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(750px circle at var(--gx) var(--gy), rgba(56, 152, 255, 0.15), rgba(155, 81, 224, 0.12), transparent 65%),
        radial-gradient(circle at 10% 15%, rgba(0, 242, 213, 0.08), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(155, 81, 224, 0.10), transparent 50%),
        #0c101c;
    }

    
    @media (min-width: 481px) {
      #app {
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
      }
    }
    
    #app {
      max-width: 440px;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* iOS Glassmorphic Top Header */
    header#top-bar {
      padding: max(10px, env(safe-area-inset-top, 10px)) 14px 10px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: rgba(12, 16, 28, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }
    .brand-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 12px rgba(0, 242, 213, 0.3);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.07);
      color: var(--tx);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    /* 2-Segment Switch: Company vs Customers */
    .d-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(18, 26, 44, 0.94);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 3.5px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .d-switch button {
      background: none;
      border: 0;
      color: var(--mut);
      padding: 7px 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .d-switch button.a {
      background: linear-gradient(135deg, var(--ac), var(--ac2)) !important;
      color: #07101c !important;
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 35%, transparent);
    }

    /* Trip Selector Row - Moved DOWN under the 2-segment switcher */
    .trip-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .trip-pill-select {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      color: var(--tx);
      font-size: 12px;
      font-weight: 600;
      border-radius: 12px;
      padding: 7px 10px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }
    .trip-add-btn {
      background: rgba(56, 152, 255, 0.18);
      border: 1px solid rgba(56, 152, 255, 0.4);
      color: var(--bl);
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .trip-add-btn:active {
      transform: scale(0.94);
    }

    /* Scrollable Content */
    main#m {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 20px;
    }
    main#m::-webkit-scrollbar {
      width: 4px;
    }
    main#m::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* Cards */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* iOS Jiggle / Widget Move & Resize Mode */
    @keyframes iosWiggle {
      0% { transform: rotate(-0.8deg) scale(0.995); }
      50% { transform: rotate(0.8deg) scale(1.005); }
      100% { transform: rotate(-0.8deg) scale(0.995); }
    }
    .ios-editing {
      animation: iosWiggle 0.28s infinite ease-in-out;
      transform-origin: center center;
      position: relative;
      user-select: none;
    }
    .ios-editing:nth-child(even) {
      animation-duration: 0.32s;
      animation-direction: reverse;
    }
    .widget-actions-overlay {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
    }
    .widget-tool-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 8px;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* Floating Bottom Dock Navigation */
    nav#nv {
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 0 10px max(10px, env(safe-area-inset-bottom, 10px));
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(17, 24, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 6px 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    nav#nv button {
      flex: 1;
      background: none;
      border: 0;
      color: #91a2bf;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 18px;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    nav#nv button b {
      display: block;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.1;
      transition: transform 0.15s ease;
    }
    nav#nv button:active {
      transform: scale(0.92);
    }
    nav#nv button.a {
      color: #ffffff !important;
      background: color-mix(in srgb, var(--ac) 24%, #1d2842) !important;
      border: 1px solid color-mix(in srgb, var(--ac) 45%, transparent);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 28%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent);
    }
    nav#nv button.a b {
      filter: drop-shadow(0 0 6px var(--ac));
      transform: translateY(-1px);
    }

    /* iOS Grid for Widgets */
    .ios-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: rgba(22, 32, 56, 0.75);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 88px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .kpi-box.full-span {
      grid-column: span 2;
    }
    .kpi-lbl {
      color: var(--mut);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: -0.5px;
    }
    .kpi-sub {
      color: var(--mut);
      font-size: 11px;
      margin-top: 2px;
    }

    .g { color: var(--gr); }
    .r { color: var(--rd); }
    .m { color: var(--mut); }
    .a { color: var(--am); }
    .c { color: var(--cy); }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill.g { background: rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.35); }
    .pill.r { background: rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.35); }
    .pill.a { background: rgba(255, 165, 2, 0.15); border-color: rgba(255, 165, 2, 0.35); }

    .ios-bar {
      height: 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 8px 0;
    }
    .ios-bar b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cy), var(--bl));
      border-radius: 6px;
    }
    .ios-bar b.exp {
      background: linear-gradient(90deg, var(--am), var(--rd));
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border: 0;
    }

    .btn {
      width: 100%;
      min-height: 42px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.pri {
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #061224;
      box-shadow: 0 4px 16px rgba(0, 242, 213, 0.35);
    }
    .btn.sec {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      border: 1px solid var(--line);
    }
    .btn.s {
      min-height: 32px;
      padding: 5px 11px;
      font-size: 11.5px;
      width: auto;
    }

    input, select {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 42px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus {
      border-color: var(--bl);
    }

    /* iOS Bottom Sheet Modals */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .ov.on {
      display: flex;
    }
    .sheet {
      background: #151d30;
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 26px 26px 0 0;
      padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 10px));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: sheetUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      margin: 4px auto 14px;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-head h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* Modern Official Paper Bill Styling */
    .paper {
      background: #ffffff;
      color: #0b1b33;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid #dbe3ef;
    }
    .bill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f274a;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .bill-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bill-logo-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }
    .bill-meta-right {
      text-align: right;
      font-size: 11.5px;
      color: #475569;
    }
    .bill-meta-right b {
      font-size: 15px;
      color: #0f172a;
    }
    .bill-contact-bar {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
      color: #334155;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .pr {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .pay-history-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }
    .bill-qr-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fafafa;
      border-radius: 12px;
      padding: 10px;
    }
    .bill-qr-box img {
      width: 88px;
      height: 120px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .bill-qr-text {
      font-size: 11.5px;
      color: #334155;
    }
    .bill-qr-text b {
      font-size: 13px;
      color: #0f172a;
    }

    .stamp {
      position: absolute;
      right: 22px;
      bottom: 22px;
      border: 4px solid #16a34a;
      color: #16a34a;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.12em;
      padding: 3px 16px;
      border-radius: 10px;
      transform: rotate(-12deg);
      opacity: 0.88;
      pointer-events: none;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      background: rgba(18, 26, 46, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 60;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
    }

    @media print {
      body * { visibility: hidden; }
      .paper, .paper * { visibility: visible; }
      .ov, .sheet { position: static; max-height: none; overflow: visible; background: transparent; border: 0; padding: 0; }
      .paper { page-break-after: always; box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>

  <div id="gemini-bg" aria-hidden="true"></div>

  <div id="app">
    <!-- Header: Logo, 2-segment switcher, and Trip Selector below it -->
    <header id="top-bar">

        document.documentElement.style.setProperty('--gy', py + 'px');
      };
      window.addEventListener('pointermove', e => update(e.clientX, e.clientY), { passive: true });

    })();

    const $ = id => document.getElementById(id);
    const sum = a => a.reduce((s, x) => s + x, 0);
    const TODAY = new Date().toISOString().slice(0, 10);
    const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const inr = p => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format((p || 0) / 100);
    const dt = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
    const mon = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' }) : '-';

    // Fresh Data Store (Zero Old Demo Examples)
    let D = {
      trips: [],
      cust: [],
      enr: [],
      exp: []
    };

    try {
      const saved = localStorage.getItem('nb_fresh_store_v3');
      if (saved) D = JSON.parse(saved);
    } catch(e) {}
    const persist = () => {
      try { localStorage.setItem('nb_fresh_store_v3', JSON.stringify(D)); } catch(e) {}
    };

    // Widget customizer & movable order & sizes (1x1 or 2x1)
    let WIDGET_CONFIG = [
      { id: 'received', title: 'Money Received', enabled: true, full: false },
      { id: 'due', title: 'To Be Received', enabled: true, full: false },
      { id: 'expenses', title: 'Expenses Done', enabled: true, full: false },
      { id: 'profit', title: 'Net Profit', enabled: true, full: false },
      { id: 'enrolled', title: 'Enrolled Travelers', enabled: true, full: false },
      { id: 'cashflow', title: 'Cashflow Overview', enabled: true, full: true }
    ];

    try {
      const savedCfg = localStorage.getItem('nb_widget_cfg_v3');
      if (savedCfg) WIDGET_CONFIG = JSON.parse(savedCfg);
    } catch(e) {}
    const saveWidgetConfig = () => {
      try { localStorage.setItem('nb_widget_cfg_v3', JSON.stringify(WIDGET_CONFIG)); } catch(e) {}
    };

    // State
    const S = {
      mode: 'company', // 'company' or 'customers'
      tab: 0,
      trip: null,
      open: null,
      enr: null,
      q: '',
      isJiggling: false
    };

    if (D.trips.length > 0) {
      S.trip = D.trips[0].id;
    }

    const net = e => sum((e.pay || []).map(p => p.a));
    const rev = e => (e.price || 0) - (e.disc || 0);
    const due = e => Math.max(0, rev(e) - net(e));
    const cu = id => D.cust.find(c => c.id === id);
    const tr = id => D.trips.find(t => t.id === id);
    const no = e => {
      const t = tr(e.t);
      const yr = t ? t.s.slice(0, 4) : '2026';
      return 'NB-' + yr + '-' + String(D.enr.indexOf(e) + 1).padStart(4, '0');
    };

    // Active trip financial totals
    const tot = tId => {
      const es = D.enr.filter(e => e.t === tId);
      const ex = D.exp.filter(x => x.t === tId);
      const rv = sum(es.map(rev));
      const got = sum(es.map(net));
      const inv = sum(ex.map(x => x.a));
      return { es, ex, rv, got, inv, due: Math.max(0, rv - got), pl: rv - inv };
    };

    // Whole Company all-time stats
    const companyStats = () => {
      const allRv = sum(D.enr.map(rev));
      const allGot = sum(D.enr.map(net));
      const allDue = Math.max(0, allRv - allGot);
      const allExp = sum(D.exp.map(x => x.a));
      const allProfit = allRv - allExp;
      return { allRv, allGot, allDue, allExp, allProfit };
    };

    const pill = (x, c) => `<span class="pill ${c}">${x}</span>`;
    const stat = e => due(e) === 0 ? pill('Paid', 'g') : net(e) === 0 ? pill('Unpaid', 'r') : pill('Partial', 'a');

        ['🚐', 'Expenses'],
        ['💰', 'Money'],

        ['💳', 'Billing'],
        ['🧾', 'Bills']
      ]

        openNewTrip();

        S.open = S.enr = null;
        R();

              <div style="font-size:11px;font-weight:700;color:var(--cy);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px">

              </div>

                </div>

                    ${inr(c.allProfit)}
                  </div>
                </div>
              </div>
              <div class="row" style="border:0;padding:6px 0 0;font-size:11.5px;color:var(--mut)">

                    content = `
                      <div class="kpi-lbl">Money Received</div>
                      <div class="kpi-val g">${inr(tStats.got)}</div>
                      <div class="kpi-sub">Collected cash</div>
                    `;
                  } else if (w.id === 'due') {
                    content = `
                      <div class="kpi-lbl">To Be Received</div>
                      <div class="kpi-val a">${inr(tStats.due)}</div>
                      <div class="kpi-sub">Remaining balance</div>

                  } else if (w.id === 'expenses') {
                    content = `

                      <div class="kpi-sub">${tStats.ex.length} items paid</div>

    // Main Render
    function R() {
      // Update trip dropdown
      const sel = $('trip-sel');
      if (D.trips.length === 0) {
        sel.innerHTML = `<option value="">+ New Departure...</option>`;
      } else {
        sel.innerHTML = [...D.trips].sort((a,b)=>b.s.localeCompare(a.s)).map(t => `
          <option value="${t.id}" ${t.id === S.trip ? 'selected' : ''}>${esc(t.n)}</option>
        `).join('') + `<option value="__new__">+ New Departure...</option>`;
      }

      // Render Active View
      const activeViews = VIEWS[S.mode];
      const activeTabFn = activeViews[S.tab] || activeViews[0];
      $('m').innerHTML = activeTabFn();

      // Render Floating Bottom Dock Navigation
      const activeTabs = MODE_TABS[S.mode];
      $('nv').innerHTML = activeTabs.map((t, i) => `
        <button class="${i === S.tab ? 'a' : ''}" onclick="setTab(${i})">
          <b>${t[0]}</b>${t[1]}
        </button>
      `).join('');
    }

    function setTab(i) {
      S.tab = i;
      R();
      $('m').scrollTop = 0;
    }

    // Widget customizer helpers
    function moveWidget(idx, dir) {
      const enabledList = WIDGET_CONFIG.filter(w => w.enabled);
      const target = idx + dir;
      if (target < 0 || target >= enabledList.length) return;
      const itemA = enabledList[idx];
      const itemB = enabledList[target];
      const idxA = WIDGET_CONFIG.indexOf(itemA);
      const idxB = WIDGET_CONFIG.indexOf(itemB);
      WIDGET_CONFIG[idxA] = itemB;
      WIDGET_CONFIG[idxB] = itemA;
      saveWidgetConfig();
      R();
    }

    function toggleWidgetSize(idx) {
      const enabledList = WIDGET_CONFIG.filter(w => w.enabled);
      const item = enabledList[idx];
      if (item) {
        item.full = !item.full;
        saveWidgetConfig();
        R();
      }
    }

    // Modal Helpers
    function openM(title, bodyHtml) {
      $('sheet').innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>${title}</h2>
          <button class="icon-btn" onclick="closeM()" style="width:28px;height:28px;font-size:12px">✕</button>
        </div>
        ${bodyHtml}
      `;
      $('ov').classList.add('on');
    }
    function closeM() { $('ov').classList.remove('on'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

    function toast(m) {
      const t = $('toast');
      t.textContent = m;
      t.style.display = 'block';
      clearTimeout(toast.h);
      toast.h = setTimeout(() => t.style.display = 'none', 3000);
    }

    // Modals
    function openNewTrip() {
      openM('Create Tour Departure', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Tour Name *</label><input id="tn" placeholder="e.g. Manali Adventure Expedition"></div>
          <div><label class="m" style="font-size:11.5px">Destination</label><input id="td" placeholder="e.g. Manali, Himachal Pradesh"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:11.5px">Start Date</label><input id="ts" type="date" value="${TODAY}"></div>
            <div style="flex:1"><label class="m" style="font-size:11.5px">End Date</label><input id="te" type="date" value="${TODAY}"></div>
          </div>
          <p id="t_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveNewTrip()">Create Departure</button>
        </div>
      `);
    }

    function saveNewTrip() {
      const n = $('tn').value.trim();
      if (!n) { $('t_err').textContent = 'Trip name is required.'; return; }
      const id = 't' + Date.now();
      const s = $('ts').value || TODAY;
      const e = $('te').value || s;
      D.trips.unshift({ id, n, dest: $('td').value.trim() || 'Tour', s, e, st: 'Open' });
      persist();
      S.trip = id;
      closeM();
      R();
      toast('New departure created.');
    }

        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Customer Name *</label><input id="pn" placeholder="Full name"></div>
          <div><label class="m" style="font-size:11.5px">10-Digit Mobile *</label><input id="pp" type="tel" placeholder="e.g. 9876543210"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:11.5px">Package Price (₹) *</label><input id="pb" type="number" placeholder="35000"></div>
            <div style="flex:1"><label class="m" style="font-size:11.5px">Discount (₹)</label><input id="pd" type="number" placeholder="0" value="0"></div>
          </div>
          <p id="p_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveEnroll()">Complete Enrollment</button>
        </div>
      `);
    }

    function saveEnroll() {
      const n = $('pn').value.trim();
      const d = $('pp').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
      const b = Math.round(parseFloat($('pb').value) * 100);
      const x = Math.round((parseFloat($('pd').value) || 0) * 100);
      const err = $('p_err');

      if (!n) { err.textContent = 'Please enter traveler name.'; return; }
      if (!/^[6-9]\d{9}$/.test(d)) { err.textContent = 'Enter a valid 10-digit Indian mobile number.'; return; }
      if (!(b > 0)) { err.textContent = 'Package price must be greater than zero.'; return; }
      if (x < 0 || x >= b) { err.textContent = 'Discount must be less than the price.'; return; }

      let c = D.cust.find(c => c.ph.replace(/\D/g, '').slice(-10) === d);
      if (!c) {
        c = { id: 'c' + Date.now(), n, ph: '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) };
        D.cust.push(c);
      }
      if (D.enr.some(z => z.c === c.id && z.t === S.trip)) {
        err.textContent = c.n + ' is already enrolled on this trip.';
        return;
      }
      D.enr.push({ id: 'e' + Date.now(), c: c.id, t: S.trip, price: b, disc: x, pay: [] });
      persist();
      closeM();
      R();
      toast('Traveler enrolled.');
    }

    // EDIT ENROLLMENT MODAL
    function openEditEnroll(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      openM('Edit Enrollment', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Customer Name *</label><input id="ep_n" value="${esc(c.n)}"></div>
          <div><label class="m" style="font-size:11.5px">10-Digit Mobile *</label><input id="ep_p" value="${esc(c.ph)}"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:11.5px">Package Price (₹) *</label><input id="ep_b" type="number" value="${e.price / 100}"></div>
            <div style="flex:1"><label class="m" style="font-size:11.5px">Discount (₹)</label><input id="ep_d" type="number" value="${e.disc / 100}"></div>
          </div>
          <p id="ep_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveEditEnroll('${enrId}')">Update Enrollment</button>
          <button class="btn sec" style="color:var(--rd)" onclick="deleteEnroll('${enrId}')">Delete Traveler</button>
        </div>
      `);
    }

    function saveEditEnroll(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      const n = $('ep_n').value.trim();
      const ph = $('ep_p').value.trim();
      const b = Math.round(parseFloat($('ep_b').value) * 100);
      const d = Math.round((parseFloat($('ep_d').value) || 0) * 100);
      const err = $('ep_err');

      if (!n) { err.textContent = 'Name is required.'; return; }
      if (!(b > 0)) { err.textContent = 'Price must be greater than zero.'; return; }
      if (d < 0 || d >= b) { err.textContent = 'Discount must be less than price.'; return; }

      c.n = n;
      c.ph = ph;
      e.price = b;
      e.disc = d;
      persist();
      closeM();
      R();
      toast('Enrollment updated.');
    }

    function deleteEnroll(enrId) {
      if (confirm('Are you sure you want to remove this traveler from the departure?')) {
        D.enr = D.enr.filter(x => x.id !== enrId);
        persist();
        closeM();
        R();
        toast('Traveler removed.');
      }
    }

    function openPay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      openM('Record Payment', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="m" style="font-size:12px">${esc(c.n)} • Remaining Due: <b class="a">${inr(due(e))}</b></div>
          <div><label class="m" style="font-size:11.5px">Amount in ₹ *</label><input id="p_amt" type="number" placeholder="Enter amount"></div>
          <div>
            <label class="m" style="font-size:11.5px">Payment Mode</label>
            <select id="p_mth">
              <option>UPI</option>
              <option>Cash</option>
              <option>Bank transfer</option>
              <option>Card</option>
            </select>
          </div>
          <div><label class="m" style="font-size:11.5px">Reference / UTR</label><input id="p_ref" placeholder="e.g. UPI-1234"></div>
          <p id="pay_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="savePay('${enrId}')">Record Payment</button>
        </div>
      `);
    }

    function savePay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const a = Math.round(parseFloat($('p_amt').value) * 100);
      const err = $('pay_err');
      if (!(a > 0)) { err.textContent = 'Enter an amount greater than 0.'; return; }
      if (a > due(e)) { err.textContent = `Overpayment blocked: remaining balance is ${inr(due(e))}.`; return; }

      e.pay.push({ d: TODAY, a, m: $('p_mth').value, ref: $('p_ref').value.trim() || 'PAY-' + (e.pay.length + 1) });
      persist();
      closeM();
      R();
      toast('Payment recorded.');
    }

    function editPayment(enrId, pIdx) {
      const e = D.enr.find(x => x.id === enrId);
      const p = e.pay[pIdx];
      openM(`Edit ${pIdx + 1}${pIdx === 0 ? 'st' : pIdx === 1 ? 'nd' : pIdx === 2 ? 'rd' : 'th'} Payment`, `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Amount in ₹ *</label><input id="ed_amt" type="number" value="${p.a / 100}"></div>
          <div>
            <label class="m" style="font-size:11.5px">Payment Mode</label>
            <select id="ed_mth">
              <option ${p.m === 'UPI' ? 'selected' : ''}>UPI</option>
              <option ${p.m === 'Cash' ? 'selected' : ''}>Cash</option>
              <option ${p.m === 'Bank transfer' ? 'selected' : ''}>Bank transfer</option>
              <option ${p.m === 'Card' ? 'selected' : ''}>Card</option>
            </select>
          </div>
          <div><label class="m" style="font-size:11.5px">Reference</label><input id="ed_ref" value="${esc(p.ref || '')}"></div>
          <div><label class="m" style="font-size:11.5px">Date</label><input id="ed_d" type="date" value="${p.d}"></div>
          <button class="btn pri" onclick="saveEditedPayment('${enrId}', ${pIdx})">Save Changes</button>
          <button class="btn sec" style="color:var(--rd)" onclick="deletePayment('${enrId}', ${pIdx})">Delete Entry</button>
        </div>
      `);
    }

    function saveEditedPayment(enrId, pIdx) {
      const e = D.enr.find(x => x.id === enrId);
      const a = Math.round(parseFloat($('ed_amt').value) * 100);
      if (!(a > 0)) return;
      e.pay[pIdx].a = a;
      e.pay[pIdx].m = $('ed_mth').value;
      e.pay[pIdx].ref = $('ed_ref').value.trim();
      e.pay[pIdx].d = $('ed_d').value || TODAY;
      persist();
      closeM();
      R();
      toast('Payment updated.');
    }

    function deletePayment(enrId, pIdx) {
      if (confirm('Delete this payment entry?')) {
        const e = D.enr.find(x => x.id === enrId);
        e.pay.splice(pIdx, 1);
        persist();
        closeM();
        R();
        toast('Payment deleted.');
      }
    }

    function openExpense() {
      if (!S.trip) { openNewTrip(); return; }
      openM('Add Trip Expense', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div>
            <label class="m" style="font-size:11.5px">Expense Category</label>
            <select id="x_cat">
              <option>Hotels</option>
              <option>Vehicles</option>
              <option>Camps</option>
              <option>Food</option>
              <option>Permits</option>
              <option>Other facilities</option>
            </select>
          </div>
          <div><label class="m" style="font-size:11.5px">Vendor Name</label><input id="x_ven" placeholder="e.g. Mountain Resort / Cabs"></div>
          <div><label class="m" style="font-size:11.5px">Amount in ₹ *</label><input id="x_amt" type="number" placeholder="Enter amount"></div>
          <p id="x_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveExpense()">Save Expense</button>
        </div>
      `);
    }

    function saveExpense() {
      const a = Math.round(parseFloat($('x_amt').value) * 100);
      const v = $('x_ven').value.trim();
      const err = $('x_err');
      if (!v || !(a > 0)) { err.textContent = 'Please enter vendor and amount.'; return; }

      D.exp.push({ t: S.trip, cat: $('x_cat').value, v, a, d: TODAY });
      persist();
      closeM();
      R();
      toast('Expense recorded.');
    }

    // OFFICIAL BILL / RECEIPT PREVIEW MODAL
    function previewBill(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c), t = tr(e.t), ok = due(e) === 0;

      openM(ok ? 'Official Paid-in-Full Receipt' : 'Booking Billing Statement', `
        <div class="paper">
          <!-- Official Company Header with Logo and Contacts -->
          <div class="bill-header">
            <div class="bill-logo-wrap">
              <img src="${LOGO_URI}" alt="${COMPANY_NAME}">
              <div>
                <b style="font-size:17px;color:#0b1b33">${COMPANY_NAME}</b>
                <div style="font-size:11px;color:#64748b">Explore. Journey. Discover.</div>
              </div>
            </div>
            <div class="bill-meta-right">
              <b>${ok ? 'RECEIPT' : 'BILL STATEMENT'}</b>
              <div>${no(e)}</div>
            </div>
          </div>

          <!-- Contact Bar -->
          <div class="bill-contact-bar">
            <span>📷 Instagram: <b>@${INSTAGRAM_HANDLE}</b></span>
            <span>✉️ ${CONTACT_EMAIL}</span>
          </div>

          <div style="margin-bottom:10px;font-size:12.5px;color:#1e293b">
            <div><b>Customer:</b> ${esc(c.n)} (${c.ph})</div>
            <div><b>Tour:</b> ${esc(t ? t.n : 'Expedition')} • 📍 ${esc(t ? t.dest : '')}</div>
            <div><b>Dates:</b> ${t ? dt(t.s) : ''} to ${t ? dt(t.e) : ''}</div>
          </div>

          <!-- Price & Dues Breakdown -->
          <div class="pr"><span>Total Package Price</span><b>${inr(e.price)}</b></div>
          ${e.disc > 0 ? `<div class="pr"><span>Special Discount</span><b>-${inr(e.disc)}</b></div>` : ''}
          <div class="pr"><span>Total Amount Paid</span><b class="g">${inr(net(e))}</b></div>
          <div class="pr" style="font-size:15px"><b>Remaining Balance Due</b><b class="${due(e) > 0 ? 'a' : 'g'}">${inr(due(e))}</b></div>

          <!-- 1st Payment, 2nd Payment breakdown with Dates -->
          <div style="margin-top:10px">
            <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px">
              Payment Transaction History:
            </div>
            ${e.pay.map((p, pIdx) => `
              <div class="pay-history-item">
                <span><b>${pIdx + 1}${pIdx === 0 ? 'st' : pIdx === 1 ? 'nd' : pIdx === 2 ? 'rd' : 'th'} Payment</b> (${dt(p.d)} • ${p.m}) ${p.ref ? `Ref: ${esc(p.ref)}` : ''}</span>
                <b class="g">+${inr(p.a)}</b>
              </div>
            `).join('') || '<div style="font-size:12px;color:#94a3b8;padding:4px 0">No advance payments logged yet.</div>'}
          </div>

          <!-- PhonePe Payment QR Code Section -->
          ${!ok ? `
            <div class="bill-qr-box">
              <img src="${QR_URI}" alt="Scan to Pay">
              <div class="bill-qr-text">
                <b>Instant UPI Payment</b>
                <div>Scan this PhonePe QR code to settle the remaining balance of <b class="a">${inr(due(e))}</b> instantly via UPI.</div>
              </div>
            </div>
          ` : ''}

          ${ok ? '<div class="stamp">PAID</div>' : ''}
        </div>

        <div style="display:flex;gap:8px">
          <button class="btn pri" style="flex:1" onclick="window.print()">🖨️ Print Bill</button>
          <button class="btn sec" style="flex:1" onclick="downloadPdf('${e.id}')">📥 Save PDF</button>
        </div>
      `);
    }

    // PDF Generator using jsPDF
    function downloadPdf(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const J = window.jspdf && window.jspdf.jsPDF;
      if (!J) { toast('PDF generator not available.'); return; }
      const d = new J({ unit: 'mm', format: 'a4' });
      const c = cu(e.c), t = tr(e.t), dd = due(e), ok = dd === 0;

      // Dark Blue Header Bar
      d.setFillColor(11, 27, 51);
      d.rect(0, 0, 210, 26, 'F');
      d.setTextColor(255);
      d.setFontSize(18);
      d.setFont('helvetica', 'bold');
      d.text(COMPANY_NAME, 14, 16);
      d.setFontSize(10);
      d.text(ok ? 'PAID-IN-FULL RECEIPT' : 'BOOKING BILL STATEMENT', 196, 12, { align: 'right' });
      d.text(no(e), 196, 19, { align: 'right' });

      // Contact info bar
      d.setFillColor(241, 245, 249);
      d.rect(14, 30, 182, 8, 'F');
      d.setTextColor(51, 65, 85);
      d.setFontSize(8.5);
      d.setFont('helvetica', 'normal');
      d.text(`Instagram: @${INSTAGRAM_HANDLE}  |  Email: ${CONTACT_EMAIL}`, 16, 35.5);

      // Customer and Trip Info
      d.setTextColor(11, 27, 51);
      d.setFontSize(13);
      d.setFont('helvetica', 'bold');
      d.text(c.n, 14, 46);
      d.setFont('helvetica', 'normal');
      d.setFontSize(9.5);
      d.text(c.ph, 14, 51.5);
      d.text((t ? t.n : 'Tour') + ' - ' + (t ? t.dest : ''), 14, 58);
      d.text((t ? dt(t.s) : '') + ' to ' + (t ? dt(t.e) : ''), 14, 63.5);

      let y = 74;
      [['Total Package Price', e.price], ['Discount', e.disc], ['Payments Received', net(e)], ['Remaining Due', dd]].forEach(([l, v], j) => {
        d.setFont('helvetica', j === 3 ? 'bold' : 'normal');
        d.text(l, 14, y);
        d.text('INR ' + (v/100).toLocaleString('en-IN'), 196, y, { align: 'right' });
        d.setDrawColor(210);
        d.line(14, y + 2, 196, y + 2);
        y += 9.5;
      });

      // Payments list with 1st, 2nd payment dates
      d.setFont('helvetica', 'bold');
      d.text('Payment Transaction History:', 14, y + 4);
      d.setFont('helvetica', 'normal');
      y += 11;
      e.pay.forEach((p, pIdx) => {
        d.text(`${pIdx + 1}${pIdx === 0 ? 'st' : pIdx === 1 ? 'nd' : pIdx === 2 ? 'rd' : 'th'} Payment (${dt(p.d)} • ${p.m} ${p.ref ? `Ref: ${p.ref}` : ''})`, 14, y);
        d.text('INR ' + (p.a/100).toLocaleString('en-IN'), 196, y, { align: 'right' });
        y += 6.5;
      });

      if (ok) {
        d.setTextColor(22, 163, 74);
        d.setFont('helvetica', 'bold');
        d.setFontSize(40);
        d.text('PAID', 130, y + 30, { angle: 14 });
      }

      d.setTextColor(140);
      d.setFont('helvetica', 'normal');
      d.setFontSize(8);
      d.text('Generated by NorthBound Trips • Thank you for choosing us!', 14, 287);

      d.save(`NorthBound-${c.n.replace(/\s+/g, '_')}-Bill.pdf`);
      toast('PDF saved.');
    }

    function openSet() {
      openM('Settings', `
        <div class="card" style="padding:14px;background:rgba(28,28,32,0.85);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--cy);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            🎛 Dashboard &amp; Widgets
          </div>
          <div class="row" style="padding:8px 0;cursor:pointer" onclick="closeM();toggleJiggle()">
            <div>
              <b style="font-size:13.5px">Edit &amp; Reorder Widgets</b>
              <div class="m" style="font-size:11px">Enter wiggle mode to move (▲/▼) and resize (1x1/2x1)</div>
            </div>
            <span class="m" style="font-size:18px">›</span>
          </div>
        </div>

        <div class="card" style="padding:14px;background:rgba(28,28,32,0.85);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--bl);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            Backup &amp; Reset
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn pri s" style="flex:1" onclick="exportData()">Download JSON</button>
            <label class="btn sec s" style="flex:1;text-align:center">
              Restore JSON
              <input type="file" accept=".json" hidden onchange="importData(this.files[0])">
            </label>
          </div>
          <div style="margin-top:10px">
            <button class="btn sec s" style="width:100%;color:var(--rd)" onclick="clearAllData()">⚠️ Reset All Data (Start Fresh)</button>
          </div>
        </div>
      `);
    }

    function clearAllData() {
      if (confirm('Clear all tours, customers, payments, and start completely fresh?')) {
        D = { trips: [], cust: [], enr: [], exp: [] };
        persist();
        S.trip = null;
        closeM();
        R();
        toast('All data reset. Ready for fresh entries.');
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'northbound-trips-backup-' + TODAY + '.json';
      a.click();
      toast('Backup downloaded.');
    }

    function importData(f) {
      if (!f) return;
      f.text().then(t => {
        try {
          const d = JSON.parse(t);
          if (d && Array.isArray(d.trips)) {
            D = d;
            persist();
            S.trip = D.trips[0] ? D.trips[0].id : null;
            closeM();
            R();
            toast('Backup restored.');
          }
        } catch(e) {
          toast('Invalid JSON backup file.');
        }
      });
    }

    // Init
    R();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
