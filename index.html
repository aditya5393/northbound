    // ---- DEVELOPER SESSION TRACKING (Active Sessions in Developer Console) ----
    // Every signed-in browser gets a stable session id. The session (Gmail,
    // company, device, last-seen) is written to Firestore `sessions` when cloud
    // is connected, and mirrored in this browser's localStorage as a fallback.
    // The developer can End any session from the console; the ended device
    // signs itself out on its next 60-second heartbeat check.
    function getDeviceLabel() {
      const ua = navigator.userAgent || '';
      let browser = 'Browser';
      if (/Edg\//.test(ua)) browser = 'Edge';
      else if (/OPR\//.test(ua)) browser = 'Opera';
      else if (/Chrome\//.test(ua)) browser = 'Chrome';
      else if (/Firefox\//.test(ua)) browser = 'Firefox';
      else if (/Safari\//.test(ua)) browser = 'Safari';
      let os = 'Unknown OS';
      if (/Android/.test(ua)) os = 'Android';
      else if (/iPhone|iPad/.test(ua)) os = 'iOS';
      else if (/Windows/.test(ua)) os = 'Windows';
      else if (/Macintosh/.test(ua)) os = 'macOS';
      else if (/Linux/.test(ua)) os = 'Linux';
      const form = /Mobi|Android|iPhone|iPad/.test(ua) ? 'Mobile' : 'Desktop';
      return browser + ' • ' + os + ' • ' + form;
    }
    function getMySessionId() {
      let id = null;
      try { id = localStorage.getItem('nb_session_id'); } catch (e) {}
      if (!id) {
        id = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem('nb_session_id', id); } catch (e) {}
      }
      return id;
    }
    function readSessionMirror() {
      try { return JSON.parse(localStorage.getItem('nb_session_mirror') || '{}'); } catch (e) { return {}; }
    }
    function writeSessionMirror(map) {
      try { localStorage.setItem('nb_session_mirror', JSON.stringify(map)); } catch (e) {}
    }
    function sessionTimeAgo(iso) {
      const t = new Date(iso || 0).getTime();
      if (!t) return '—';
      const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
      if (s < 60) return 'Just now';
      if (s < 3600) return Math.floor(s / 60) + ' min ago';
      if (s < 86400) return Math.floor(s / 3600) + ' hr ago';
      return Math.floor(s / 86400) + ' d ago';
    }
    function applyIncomingSessionMap(incomingSessions) {
      if (!incomingSessions || typeof incomingSessions !== 'object') return;
      const map = readSessionMirror();
      let changed = false;
      Object.values(incomingSessions).forEach(s => {
        if (!s || !s.id) return;
        const cur = map[s.id];
        const incTime = new Date(s.lastSeen || 0).getTime() || 0;
        const curTime = cur ? (new Date(cur.lastSeen || 0).getTime() || 0) : 0;
        if (!cur || incTime >= curTime || (s.revoked && !cur.revoked)) {
          map[s.id] = s;
          changed = true;
        }
      });
      if (changed) {
        writeSessionMirror(map);
        checkMySessionRevoked();
        if (document.getElementById('dev-sessions-list')) {
          renderDevSessions(false);
        }
      }
    }
    async function publishSessionRelay(sessionsObj) {
      const packet = { type: 'sess_sync', ts: Date.now(), sessions: sessionsObj };
      if (nbCrossTabChannel) {
        try { nbCrossTabChannel.postMessage(packet); } catch (e) {}
      }
      try {
        await fetch(`https://ntfy.sh/${NB_CLOUD_SESS_TOPIC}`, {
          method: 'POST',
          body: JSON.stringify(packet)
        });
      } catch (e) {}
    }
    async function pullCloudSessionsRelay() {
      try {
        const res = await fetch(`https://ntfy.sh/${NB_CLOUD_SESS_TOPIC}/json?poll=1&since=all`, { cache: 'no-store' });
        if (res && res.ok) {
          const txt = await res.text();
          const merged = {};
          txt.split('\n').forEach(line => {
            if (!line || !line.trim()) return;
            try {
              const env = JSON.parse(line);
              if (env && env.event === 'message' && env.message) {
                const data = JSON.parse(env.message);
                if (data && data.type === 'sess_sync' && data.sessions) {
                  Object.values(data.sessions).forEach(s => {
                    if (!s || !s.id) return;
                    const prev = merged[s.id];
                    if (!prev || (s.lastSeen || '') >= (prev.lastSeen || '') || s.revoked) {
                      merged[s.id] = s;
                    }
                  });
                }
              }
            } catch (e) {}
          });
          applyIncomingSessionMap(merged);
        }
      } catch (e) {}
    }

          try {
            const env = JSON.parse(ev.data);
            if (env && env.event === 'message' && env.message) {
              const data = JSON.parse(env.message);
              if (data && data.type === 'sess_sync' && data.sessions) {
                applyIncomingSessionMap(data.sessions);
              }
            }
          } catch (e) {}
        };
      } catch (e) {}
    }

            if (s && s.id && !s.revoked) map[s.id] = s;
          });

    function initRealtimeSync() {
      if (!fbDb || !currentUser || currentUser.role === 'guest_blocked' || currentUser.companyId !== ACTIVE_COMPANY_ID) return;
      if (unsubscribeCloud) {
        unsubscribeCloud();
        unsubscribeCloud = null;

      const docRef = fbDb.collection('companies').doc(activeCompId);

      unsubscribeCloud = docRef.onSnapshot(doc => {
        // Hard isolation check: ignore snapshot if companyId mismatches
        if (ACTIVE_COMPANY_ID !== activeCompId) return;
        if (doc.exists) {
          const remote = doc.data();
          if (remote && remote.licenseStatus) {
            const prevLicense = dep.licenseStatus;
            const prevTrial = dep.trialEndsAt;
            dep.licenseStatus = remote.licenseStatus;
            if (remote.trialEndsAt) dep.trialEndsAt = remote.trialEndsAt;
            saveCompanyDeploymentsRegistry();
            // License-only cloud updates carry no business data, so the data
            // branch below would not re-render — force it so the trial card
            // appears on the other device as soon as the lock lands.
            if (dep.licenseStatus !== prevLicense || dep.trialEndsAt !== prevTrial) R();
          }
          if (remote && remote.data && (!remote.companyId || remote.companyId === activeCompId)) {
            const cloudD = remote.data;
            if (cloudD && Array.isArray(cloudD.trips)) {
              D = cloudD;
              D.companyId = activeCompId;
              try { localStorage.setItem(dep.storageKey, JSON.stringify(D)); } catch(e) {}

              if (!S.trip && D.trips.length > 0) {
                S.trip = D.trips[0].id;
              }
              R();

              const syncPill = document.getElementById('cloud-sync-tag');
              if (syncPill) {
                syncPill.innerHTML = `<span class="live-dot"></span>Live (${D.lastSync || 'Now'})`;
              }
            }
          }
        }
      }, err => {
        console.warn('Realtime sync onSnapshot:', err);
      });
    }

    // Push one company's license to THAT company's own Firestore doc, so the
    // lock/unlock reaches other devices. persist() only writes the ACTIVE
    // company's doc, so locking company B while viewing company A never
    // reached B's devices. This opens B's named Firebase app, writes ONLY
    // license fields (merge — never touches B's business data), then restores
    // the active app. Returns false when B has no cloud config or the write
    // is denied (e.g. developer is not signed into B's Firebase project).
    async function pushCompanyLicenseToCloud(compId) {
      const dep = COMPANY_DEPLOYMENTS[compId];
      if (!dep) return false;
      // Also sync licenseStatus & trialEndsAt into the target company's isolated store
      try {
        const st = loadCompanyIsolatedStore(compId);
        if (st && typeof st === 'object') {
          st.licenseStatus = dep.licenseStatus || 'active';
          st.trialEndsAt = dep.trialEndsAt || '2027-12-31';
          st.lockReason = dep.lockReason || '';
          localStorage.setItem(dep.storageKey, JSON.stringify(st));
        }
      } catch (e) {}

      const cfg = getEffectiveFirebaseConfig(compId);
      if (!cfg || !isRealFirebaseApiKey(cfg.apiKey) || typeof firebase === 'undefined') {
        // Offline / local mode: saved cleanly to local registry & storage without error
        return true;
      }
      const prevApp = fbApp, prevAuth = fbAuth, prevDb = fbDb;
      try {
        const payload = {
          companyId: compId,
          companyName: dep.companyName,
          ownerEmail: dep.ownerEmail,
          licenseStatus: dep.licenseStatus || 'active',
          trialEndsAt: dep.trialEndsAt || '2027-12-31',
          licenseUpdatedAt: dep.licenseUpdatedAt || Date.now(),
          lockReason: dep.lockReason || '',
          appLink: dep.appLink || '',
          appLinkCustom: !!dep.appLinkCustom,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: (currentUser && currentUser.email) || DEVELOPER_ADMIN_EMAIL
        };
        // Prefer the active authenticated Firestore instance if available on the same project
        if (fbDb && fbApp && fbApp.options && fbApp.options.projectId === cfg.projectId) {
          await fbDb.collection('companies').doc(compId).set(payload, { merge: true });
          return true;
        }
        const apps = firebase.apps || [];
        const existingApp = apps.find(a => a.options && a.options.projectId === cfg.projectId) ||
                            apps.find(a => a.name === compId);
        const app = existingApp || firebase.initializeApp(cfg, compId);
        const db = app.firestore();
        await db.collection('companies').doc(compId).set(payload, { merge: true });
        return true;
      } catch (e) {
        console.warn('License cloud push failed:', e);
        return false;
      } finally {
        fbApp = prevApp; fbAuth = prevAuth; fbDb = prevDb;
      }
    }

    async function deleteCompanyCloudDoc(compId, cfg) {
      if (!cfg || !isRealFirebaseApiKey(cfg.apiKey) || typeof firebase === 'undefined') return;
      try {

    // ---- Client links: ONE deployment serves all companies ----
    // The link is always <production deployment> + ?company=<id>. The two links
    // differ only in their base URL: at creation the share came from a
    // non-production page (old fabricated link / preview / local), while after
    // owner login it came from the live https site. So the app remembers the
    // production deployment the first time it runs on one, and every later
    // share — even from localhost or a Vercel preview — reuses that remembered
    // production URL instead of the page it happens to be open on.
    function isProductionLikeUrl(href) {
      try {
        const u = new URL(href);
        if (u.protocol !== 'https:') return false;
        const h = u.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local')) return false;
        if (h.includes('-git-')) return false; // Vercel preview deployment
        return true;
      } catch (e) { return false; }
    }
    function getProductionBaseUrl() {
      try { return localStorage.getItem('nb_production_base_url') || ''; } catch (e) { return ''; }
    }
    function setProductionBaseUrl(base) {
      try { localStorage.setItem('nb_production_base_url', base); } catch (e) {}
    }
    function currentPageClientLink(compId) {
      try {
        const u = new URL(window.location.href);
        u.hash = '';
        u.searchParams.set('company', compId);
        return u.toString();
      } catch (e) { return ''; }
    }
    function getClientLink(compId) {
      // One deployment serves every company — the link is always the
      // production deployment + ?company=<id>. Stored per-company URLs are
      // never used, so a stale or deleted deployment URL can never be shared.
      if (!COMPANY_DEPLOYMENTS[compId]) return '';
      if (isProductionLikeUrl(window.location.href)) {
        // This IS the live production deployment — remember it for later shares.
        try {
          const u = new URL(window.location.href);
          u.hash = '';
          u.search = '';
          const base = u.toString();
          if (getProductionBaseUrl() !== base) setProductionBaseUrl(base);
        } catch (e) {}
        return currentPageClientLink(compId);
      }
      // On localhost / file / Vercel preview: reuse the remembered production deployment.
      const base = getProductionBaseUrl();
      if (base) {
        try {
          const u = new URL(base);
          u.searchParams.set('company', compId);
          return u.toString();
        } catch (e) {}
      }
      return currentPageClientLink(compId);
    }
    // Warn when a share would go out from a non-production page with no
    // remembered production deployment — that link 404s for clients.
    function warnIfSharingFromNonProduction() {
      if (!isProductionLikeUrl(window.location.href) && !getProductionBaseUrl()) {
        toast('⚠️ Sharing from a preview/local page — this link may 404 for clients. Open the production site and share from there.');
      }
    }

    // Revoke every active session of one company (local mirror + Firestore, active + target project).
    async function revokeCompanySessions(compId) {
      const now = new Date().toISOString();
      const toBroadcast = {};
      const map = readSessionMirror();
      Object.values(map).forEach(s => {
        if (s && s.id && s.companyId === compId && !s.revoked) {
          s.revoked = true;
          s.lastSeen = now;
          toBroadcast[s.id] = s;
        }
      });
      writeSessionMirror(map);
      const dbs = [];
      if (fbDb) dbs.push(fbDb);
      try {
        const cfg = getEffectiveFirebaseConfig(compId);
        if (cfg && isRealFirebaseApiKey(cfg.apiKey) && typeof firebase !== 'undefined') {
          const sameProject = fbApp && fbApp.options && fbApp.options.projectId === cfg.projectId;
          if (!sameProject) {
            const existingApp = (firebase.apps || []).find(a => a.name === compId);
            const app = existingApp || firebase.initializeApp(cfg, compId);
            dbs.push(app.firestore());
          }
        }
      } catch (e) {}
      for (const db of dbs) {
        try {
          const snap = await db.collection('sessions').where('companyId', '==', compId).limit(100).get();
          for (const doc of snap.docs) {
            try { await db.collection('sessions').doc(doc.id).set({ revoked: true, lastSeen: now }, { merge: true }); } catch (e) {}
          }
        } catch (e) {}
      }
      if (Object.keys(toBroadcast).length) {
        await publishSessionRelay(toBroadcast);
      }
    }

        now.setDate(now.getDate() + 30);

        dep.licenseStatus = 'active';

        now.setFullYear(now.getFullYear() + 1);

    function getFirestoreSecurityRulesCode() {

service cloud.firestore {

      );

    // ACTIVE SESSIONS (sessions/{sessionId}) — Developer Operator Console
    // Any signed-in user may write ONLY their own session (email must match

    // The developer may revoke (update) any session; a user may delete only

    match /sessions/{sessionId} {
      allow list, get: if request.auth != null &&

      allow create, update: if request.auth != null && (

    }
  }
}`;

    function uploadCompanyAsset(file, targetField, fromMoneyTab = false) {
      if (!file) return;
      preserveUnsavedBillingInputs(fromMoneyTab ? 'm_cb' : 'cb');
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 360;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.86);

          if (!D.companyProfile) D.companyProfile = {};
          D.companyProfile[targetField] = dataUrl;
          const dep = getActiveDeployment();
          dep[targetField] = dataUrl;
          saveCompanyDeploymentsRegistry();
          persist();
          syncBrandingConstants();
          R();
          if (!fromMoneyTab) {
            openCompanyBrandingModal();
          }
          toast(targetField === 'logoUri' ? '✓ Company Logo updated on all Bills & Passes!' : '✓ Payment UPI QR Code updated on all Bills!');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // SAVE PDF IDENTICAL TO PREVIEW: Captures the preview DOM with html2canvas and puts it in jsPDF
    async function savePdfDirect(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      if (!e) return;
      const c = cu(e.c);

      let el = document.getElementById('printable-bill-area');
      let tempCreated = false;
      if (!el) {
        const tempDiv = document.createElement('div');
        tempDiv.id = 'temp-pdf-render';
        tempDiv.style.position = 'fixed';
        tempDiv.style.left = '-9999px';
        tempDiv.style.top = '0';
        tempDiv.style.width = '440px';
        tempDiv.innerHTML = getBillHtml(enrId);
        document.body.appendChild(tempDiv);
        el = document.getElementById('printable-bill-area');
        tempCreated = true;
      }

      toast('Generating Bill PDF...');

      try {
        const filename = `${getCompanySlug()}-${c.n.replace(/\s+/g, '_')}-Bill.pdf`;
        const pdf = await generatePdfFromElement(el, filename, true);
        if (tempCreated) {
          const tempDiv = document.getElementById('temp-pdf-render');
          if (tempDiv) document.body.removeChild(tempDiv);
        }
        toast('PDF saved successfully!');
        return pdf;
      } catch (err) {
        if (tempCreated) {
          const tempDiv = document.getElementById('temp-pdf-render');
          if (tempDiv) document.body.removeChild(tempDiv);
        }
        console.error(err);
        window.print();
      }
    }

    // Format YYYY-MM-DD to DD-MM-YYYY for Excel Report
    function formatExcelDate(dStr) {
      if (!dStr || typeof dStr !== 'string') return '-';
      const clean = dStr.trim().slice(0, 10);
      const parts = clean.split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        return parts[2] + '-' + parts[1] + '-' + parts[0];
      }
      return dStr;
    }

    // Settings > Export > Company-Wise Download Excel (For Owner - Microsoft Excel / OneDrive / Google Sheets Ready)
    function exportExcelForOwner() {
      if (typeof XLSX === 'undefined') {
        toast('Excel library is loading, please try again in a moment.');
        return;
      }

      const dep = getActiveDeployment();
      // Strictly export ONLY the currently logged-in company's isolated data (never mixing companies)
      const sourceStore = D;
      const enrollments = sourceStore.enr || [];
      const findCust = id => (sourceStore.cust || []).find(c => c.id === id);
      const findTrip = id => (sourceStore.trips || []).find(t => t.id === id);

      const headers = [
        'Customer Name',
        'Trip Name',
        'Phone',
        'Paid Amount',
        'Remaining Amount',
        'Total Amount',
        'Payment Date',
        'UTR',
        'Status'
      ];

      const rows = [];
      let totalReceivedRupees = 0;
      let totalRemainingRupees = 0;
      let totalPackageRupees = 0;

      enrollments.forEach(e => {
        const c = findCust(e.c) || { n: 'Customer', ph: '-' };
        const t = findTrip(e.t) || { n: 'Tour Departure' };

        const paidPaise = sum((e.pay || []).map(p => p.a));
        const totalPaise = (e.price || 0) - (e.disc || 0);
        const remPaise = Math.max(0, totalPaise - paidPaise);

        const paidRupees = Math.round(paidPaise / 100);
        const remRupees = Math.round(remPaise / 100);
        const totalRupees = Math.round(totalPaise / 100);

        totalReceivedRupees += paidRupees;
        totalRemainingRupees += remRupees;
        totalPackageRupees += totalRupees;

        const payments = e.pay || [];
        const payDateStr = payments.length > 0
          ? payments.map(p => formatExcelDate(p.d)).join(', ')
          : '-';

        const utrStr = payments.length > 0
          ? payments.map(p => p.utr || p.ref || p.m || '-').join(', ')
          : '-';

        const statusStr = e.b_st === 'cancelled'
          ? 'Cancelled'
          : (remPaise === 0 ? 'Paid' : (paidPaise === 0 ? 'Unpaid' : 'Partial'));

        rows.push([
          c.n || '-',
          t.n || '-',
          c.ph || '-',
          paidRupees,
          remRupees,
          totalRupees,
          payDateStr,
          utrStr,
          statusStr
        ]);
      });

      // Last 2 rows = Totals: Total Received, Total Remaining - bold
      const totalReceivedRow = [
        'Total Received',
        dep.companyName,
        '',
        totalReceivedRupees,
        '',
        totalPackageRupees,
        '',
        '',
        ''
      ];

      const totalRemainingRow = [
        'Total Remaining',
        dep.companyId,
        '',
        '',
        totalRemainingRupees,
        '',
        '',
        '',
        ''
      ];

      const aoa = [headers, ...rows, totalReceivedRow, totalRemainingRow];
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      // Currency format string (₹)
      const currencyFmt = '"₹"#,##0';

      // Styles for SheetJS / xlsx-js-style (Compatible with MS Excel, OneDrive & Google Sheets)
      const borderThin = {
        top: { style: 'thin', color: { rgb: 'CBD5E1' } },
        bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
        left: { style: 'thin', color: { rgb: 'CBD5E1' } },
        right: { style: 'thin', color: { rgb: 'CBD5E1' } }
      };

      const headerStyle = {
        font: { bold: true, color: { rgb: 'FFFFFF' }, name: 'Calibri', sz: 11 },
        fill: { patternType: 'solid', fgColor: { rgb: '0F274A' } },
        alignment: { horizontal: 'center', vertical: 'center' },
        border: borderThin
      };

      const totalRowStyle = {
        font: { bold: true, color: { rgb: '0F172A' }, name: 'Calibri', sz: 11 },
        fill: { patternType: 'solid', fgColor: { rgb: 'E2E8F0' } },
        alignment: { vertical: 'center' },
        border: {
          top: { style: 'medium', color: { rgb: '0F274A' } },
          bottom: { style: 'medium', color: { rgb: '0F274A' } },
          left: { style: 'thin', color: { rgb: 'CBD5E1' } },
          right: { style: 'thin', color: { rgb: 'CBD5E1' } }
        }
      };

      const totalRowsStartIdx = 1 + rows.length;

      for (let r = 0; r < aoa.length; r++) {
        for (let c = 0; c < headers.length; c++) {
          const cellRef = XLSX.utils.encode_cell({ r, c });
          if (!ws[cellRef]) {
            ws[cellRef] = { t: 's', v: '' };
          }
          const cell = ws[cellRef];
          const isCurrencyCol = (c === 3 || c === 4 || c === 5);

          if (r === 0) {
            cell.s = headerStyle;
          } else if (r >= totalRowsStartIdx) {
            const isNumericVal = typeof cell.v === 'number';
            if (isNumericVal) {
              cell.t = 'n';
              cell.z = currencyFmt;
            }
            cell.s = {
              ...totalRowStyle,
              alignment: { horizontal: isNumericVal ? 'right' : 'left', vertical: 'center' },
              ...(isNumericVal ? { numFmt: currencyFmt } : {})
            };
          } else {
            const rowBg = r % 2 === 1 ? 'FFFFFF' : 'F8FAFC';
            if (isCurrencyCol && typeof cell.v === 'number') {
              cell.t = 'n';
              cell.z = currencyFmt;
              cell.s = {
                font: { name: 'Calibri', sz: 11, color: { rgb: '0F172A' } },
                fill: { patternType: 'solid', fgColor: { rgb: rowBg } },
                alignment: { horizontal: 'right', vertical: 'center' },
                numFmt: currencyFmt,
                border: borderThin
              };
            } else {
              const isCentered = (c === 2 || c === 6 || c === 8);
              cell.s = {
                font: {
                  name: 'Calibri',
                  sz: 11,
                  bold: c === 8 || c === 0,
                  color: {
                    rgb: c === 8
                      ? (cell.v === 'Paid' ? '16A34A' : (cell.v === 'Unpaid' ? 'DC2626' : 'D97706'))
                      : '0F172A'
                  }
                },
                fill: { patternType: 'solid', fgColor: { rgb: rowBg } },
                alignment: { horizontal: isCentered ? 'center' : 'left', vertical: 'center' },
                border: borderThin
              };
            }
          }
        }
      }

      // Auto-adjust column widths so nothing is cut off in Excel / OneDrive / Google Sheets
      const colWidths = headers.map((h, colIdx) => {
        let maxLen = h.length;
        for (let r = 1; r < aoa.length; r++) {
          const val = aoa[r][colIdx];
          let strVal = '';
          if (typeof val === 'number' && (colIdx === 3 || colIdx === 4 || colIdx === 5)) {
            strVal = '₹' + val.toLocaleString('en-IN');
          } else if (val !== null && val !== undefined) {
            strVal = String(val);
          }
          if (strVal.length > maxLen) maxLen = strVal.length;
        }
        return { wch: Math.max(maxLen + 5, 16) };
      });
      ws['!cols'] = colWidths;
      ws['!rows'] = aoa.map((_, r) => ({
        hpt: r === 0 ? 26 : (r >= totalRowsStartIdx ? 22 : 20)
      }));

      // Second Sheet: Company & Trip Financial Summary (Isolated for this company only)
      const cStats = companyStats();
      const summaryAoa = [
        ['Company Name', dep.companyName],
        ['Isolated Company ID', dep.companyId],
        ['Dedicated Firebase Project', dep.firebaseProjectId],
        ['Dedicated App Link', getClientLink(dep.companyId)],
        ['Owner Account', dep.ownerEmail],
        ['Export Date', formatExcelDate(TODAY)],
        ['Total Collected Cash (₹)', Math.round(cStats.allGot / 100)],
        ['Total Remaining Receivable (₹)', Math.round(cStats.allDue / 100)],
        ['Total Company Expenses (₹)', Math.round(cStats.allExp / 100)],
        ['Net Company Profit (₹)', Math.round(cStats.allProfit / 100)]
      ];
      const wsSummary = XLSX.utils.aoa_to_sheet(summaryAoa);
      wsSummary['!cols'] = [{ wch: 28 }, { wch: 44 }];

      const wb = XLSX.utils.book_new();
      const sheetTitle = (dep.companyName || 'Company').slice(0, 22) + ' Report';
      XLSX.utils.book_append_sheet(wb, ws, sheetTitle);
      XLSX.utils.book_append_sheet(wb, wsSummary, 'Company Summary');

      const companySlug = (dep.companyName || 'Company').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '');
      const filename = `${companySlug}-Report-${formatExcelDate(TODAY)}.xlsx`;
      XLSX.writeFile(wb, filename);
      toast(`📊 ${dep.companyName} Excel Report (${filename}) downloaded!`);
    }

    function exportData() {
      const dep = getActiveDeployment();
      const exportPayload = {
        companyId: dep.companyId,
        companyName: dep.companyName,
        firebaseProjectId: dep.firebaseProjectId,
        appLink: getClientLink(dep.companyId),
        exportedAt: new Date().toISOString(),
        data: D
      };
      const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const slug = (dep.companyName || 'company').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      a.download = `${slug}-isolated-backup-${TODAY}.json`;
      a.click();
      toast(`📦 ${dep.companyName} isolated JSON backup downloaded.`);
    }

    function importData(f) {
      if (!f) return;
      f.text().then(t => {
        try {
          const parsed = JSON.parse(t);
          if (parsed && parsed.companyId && parsed.companyId !== ACTIVE_COMPANY_ID) {
            toast(`🚫 Blocked: Backup belongs to ${parsed.companyName || parsed.companyId}, not ${COMPANY_NAME}!`);
            return;
          }
          const d = (parsed && parsed.data && Array.isArray(parsed.data.trips)) ? parsed.data : parsed;
          if (d && Array.isArray(d.trips)) {
            D = d;
            D.companyId = ACTIVE_COMPANY_ID;
            persist();
            S.trip = D.trips[0] ? D.trips[0].id : null;
            closeM();
            R();
            toast(`✓ Backup restored for ${COMPANY_NAME}.`);
          }
        } catch(e) {
          toast('Invalid JSON backup file.');
        }
      });
    }

    // Init
    R();
    if (fbDb && currentUser && !currentUser.isGuest) {
      initRealtimeSync();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
