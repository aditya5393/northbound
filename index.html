<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NorthBound - Tour Operations & Financial Management</title>
  <meta name="theme-color" content="#0c101c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #0c101c;
      --card: rgba(22, 32, 56, 0.88);
      --card-solid: #162038;
      --tx: #ffffff;
      --mut: #91a2bf;
      --line: rgba(255, 255, 255, 0.12);
      --cy: #00f2d5;
      --bl: #3898ff;
      --gr: #2ed573;
      --rd: #ff4757;
      --am: #ffa502;
      --pu: #9b51e0;
      --ac: #00f2d5;
      --ac2: #3898ff;
      --gx: 50%;
      --gy: 25%;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #gemini-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(750px circle at var(--gx) var(--gy), rgba(56, 152, 255, 0.15), rgba(155, 81, 224, 0.12), transparent 65%),
        radial-gradient(circle at 10% 15%, rgba(0, 242, 213, 0.08), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(155, 81, 224, 0.10), transparent 50%),
        #0c101c;
    }

    #app {
      max-width: 440px;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* iOS Glassmorphic Top Header */
    header#top-bar {
      padding: max(10px, env(safe-area-inset-top, 10px)) 14px 10px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(12, 16, 28, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 17.5px;
      letter-spacing: -0.3px;
    }
    .brand-logo i {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--bl), var(--gr));
      display: grid;
      place-items: center;
      color: #fff;
      font-style: normal;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(56, 152, 255, 0.35);
    }

    .trip-pill-select {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      color: var(--tx);
      font-size: 12px;
      font-weight: 600;
      border-radius: 12px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      max-width: 175px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--tx);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    /* 2-Segment Domain Switcher (Apple iOS Style) */
    .d-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(18, 26, 44, 0.94);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 3.5px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .d-switch button {
      background: none;
      border: 0;
      color: var(--mut);
      padding: 7px 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .d-switch button.a {
      background: linear-gradient(135deg, var(--ac), var(--ac2)) !important;
      color: #07101c !important;
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 35%, transparent);
    }

    /* Main Scrollable Content Area */
    main#m {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 20px;
    }
    main#m::-webkit-scrollbar {
      width: 4px;
    }
    main#m::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* iOS Glassmorphic Cards */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* iOS Floating Bottom Dock Navigation */
    nav#nv {
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 0 10px max(10px, env(safe-area-inset-bottom, 10px));
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(17, 24, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 6px 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    nav#nv button {
      flex: 1;
      background: none;
      border: 0;
      color: #91a2bf;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 18px;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    nav#nv button b {
      display: block;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.1;
      transition: transform 0.15s ease;
    }
    nav#nv button:active {
      transform: scale(0.92);
    }
    nav#nv button.a {
      color: #ffffff !important;
      background: color-mix(in srgb, var(--ac) 24%, #1d2842) !important;
      border: 1px solid color-mix(in srgb, var(--ac) 45%, transparent);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 28%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent);
    }
    nav#nv button.a b {
      filter: drop-shadow(0 0 6px var(--ac));
      transform: translateY(-1px);
    }

    /* iOS Grid for Metric Widgets */
    .ios-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: rgba(22, 32, 56, 0.75);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 88px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .kpi-lbl {
      color: var(--mut);
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: -0.5px;
    }
    .kpi-sub {
      color: var(--mut);
      font-size: 11px;
      margin-top: 2px;
    }

    .g { color: var(--gr); }
    .r { color: var(--rd); }
    .m { color: var(--mut); }
    .a { color: var(--am); }
    .c { color: var(--cy); }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill.g { background: rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.35); }
    .pill.r { background: rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.35); }
    .pill.a { background: rgba(255, 165, 2, 0.15); border-color: rgba(255, 165, 2, 0.35); }

    .ios-bar {
      height: 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 8px 0;
    }
    .ios-bar b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cy), var(--bl));
      border-radius: 6px;
    }
    .ios-bar b.exp {
      background: linear-gradient(90deg, var(--am), var(--rd));
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border: 0;
    }

    .btn {
      width: 100%;
      min-height: 42px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.pri {
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #061224;
      box-shadow: 0 4px 16px rgba(0, 242, 213, 0.35);
    }
    .btn.sec {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      border: 1px solid var(--line);
    }
    .btn.s {
      min-height: 34px;
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
    }

    input, select {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 42px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus {
      border-color: var(--bl);
    }

    /* iOS Bottom Sheet Modals */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .ov.on {
      display: flex;
    }
    .sheet {
      background: #151d30;
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 26px 26px 0 0;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 10px));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: sheetUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      margin: 4px auto 14px;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-head h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .paper {
      background: #ffffff;
      color: #0b1b33;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      position: relative;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .pr {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e3e9f2;
      font-size: 13.5px;
    }
    .stamp {
      position: absolute;
      right: 20px;
      bottom: 20px;
      border: 3.5px solid #15803d;
      color: #15803d;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.1em;
      padding: 2px 14px;
      border-radius: 8px;
      transform: rotate(-12deg);
      opacity: 0.9;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      background: rgba(18, 26, 46, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 60;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
    }

    @media print {
      body * { visibility: hidden; }
      .paper, .paper * { visibility: visible; }
      .ov, .sheet { position: static; max-height: none; overflow: visible; background: transparent; border: 0; }
      .paper { page-break-after: always; box-shadow: none; }
    }
  </style>
</head>
<body>

  <div id="gemini-bg" aria-hidden="true"></div>

  <div id="app">
    <!-- Header with logo, trip dropdown, settings, and the 2-segment domain switcher -->
    <header id="top-bar">
      <div class="top-row">
        <div class="brand-logo">
          <i>N</i><span>NorthBound</span>
        </div>
        <select id="trip-sel" class="trip-pill-select" onchange="switchTrip(this.value)"></select>
        <button class="icon-btn" onclick="openSet()" aria-label="Settings">⚙️</button>
      </div>

      <!-- Toggle: Company Stats vs Customers -->
      <div class="d-switch">
        <button id="sw-co" class="a" onclick="setMode('company')">
          🏢 Company Management
        </button>
        <button id="sw-cu" onclick="setMode('customers')">
          👥 Customers
        </button>
      </div>
    </header>

    <main id="m"></main>

    <nav id="nv"></nav>
  </div>

  <!-- iOS Bottom Sheet Modal -->
  <div class="ov" id="ov" onclick="if(event.target===this)closeM()">
    <div class="sheet" id="sheet"></div>
  </div>

  <div id="toast"></div>

  <script>
    // Cursor/Touch interactive glow tracking
    (()=>{
      let x = innerWidth / 2, y = innerHeight * .25;
      const update = (px, py) => {
        document.documentElement.style.setProperty('--gx', px + 'px');
        document.documentElement.style.setProperty('--gy', py + 'px');
      };
      window.addEventListener('pointermove', e => update(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchmove', e => { if (e.touches[0]) update(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    })();

    const $ = id => document.getElementById(id);
    const sum = a => a.reduce((s, x) => s + x, 0);
    const R_AMT = n => n * 100;
    const TODAY = new Date().toISOString().slice(0, 10);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const inr = p => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(p / 100);
    const dt = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    const mon = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' });

    // FRESH, CLEAN DATA - ZERO OLD EXAMPLES
    let D = {
      trips: [],
      cust: [],
      enr: [],
      exp: []
    };

    // Load from local storage, but purge old demo mock data (e.g. 'Goa Beach Retreat', 'Aarav Mehta')
    try {
      const saved = localStorage.getItem('nb_fresh_data_v2');
      if (saved) {
        D = JSON.parse(saved);
      }
    } catch(e) {}
    const persist = () => {
      try { localStorage.setItem('nb_fresh_data_v2', JSON.stringify(D)); } catch(e) {}
    };

    // User Widget Preferences (Configurable via Settings > Home Widgets)
    let WIDGETS = {
      received: true,
      due: true,
      expenses: true,
      profit: true,
      enrolled: true,
      cashflow: true
    };
    try {
      const savedW = localStorage.getItem('nb_widgets');
      if (savedW) WIDGETS = { ...WIDGETS, ...JSON.parse(savedW) };
    } catch(e) {}
    const saveWidgets = () => {
      try { localStorage.setItem('nb_widgets', JSON.stringify(WIDGETS)); } catch(e) {}
    };

    // State
    const S = {
      mode: 'company', // 'company' or 'customers'
      tab: 0,
      trip: null,
      open: null,
      enr: null,
      q: ''
    };

    if (D.trips.length > 0) {
      S.trip = D.trips[0].id;
    }

    const net = e => sum(e.pay.map(p => p.a));
    const rev = e => e.price - e.disc;
    const due = e => rev(e) - net(e);
    const cu = id => D.cust.find(c => c.id === id);
    const tr = id => D.trips.find(t => t.id === id);
    const no = e => {
      const t = tr(e.t);
      const yr = t ? t.s.slice(0, 4) : '2026';
      return 'NB-' + yr + '-' + String(D.enr.indexOf(e) + 1).padStart(4, '0');
    };

    // Trip calculations
    const tot = tId => {
      const es = D.enr.filter(e => e.t === tId);
      const ex = D.exp.filter(x => x.t === tId);
      const rv = sum(es.map(rev));
      const got = sum(es.map(net));
      const inv = sum(ex.map(x => x.a));
      return { es, ex, rv, got, inv, due: rv - got, pl: rv - inv };
    };

    // Whole Company stats till date across all trips + overhead
    const companyStats = () => {
      const allRv = sum(D.enr.map(rev));
      const allGot = sum(D.enr.map(net));
      const allDue = allRv - allGot;
      const allExp = sum(D.exp.map(x => x.a));
      const allProfit = allRv - allExp;
      return { allRv, allGot, allDue, allExp, allProfit };
    };

    const pill = (x, c) => `<span class="pill ${c}">${x}</span>`;
    const stat = e => due(e) === 0 ? pill('Paid', 'g') : net(e) === 0 ? pill('Unpaid', 'r') : pill('Partial', 'a');

    // Bottom Navigation Tabs by Mode
    const MODE_TABS = {
      company: [
        ['🏠', 'Home'],
        ['🚐', 'Expenses'],
        ['💰', 'Money'],
        ['📅', 'History']
      ],
      customers: [
        ['👥', 'Enrolled'],
        ['💳', 'Billing'],
        ['🧾', 'Bills']
      ]
    };

    function setMode(m) {
      S.mode = m;
      S.tab = 0;
      $('sw-co').className = m === 'company' ? 'a' : '';
      $('sw-cu').className = m === 'customers' ? 'a' : '';
      R();
    }

    function switchTrip(val) {
      if (val === '__new__') {
        openNewTrip();
        $('trip-sel').value = S.trip || '';
      } else {
        S.trip = val;
        S.open = S.enr = null;
        R();
      }
    }

    // Views
    const VIEWS = {
      company: [
        // 0: HOME - Company & Current Trip Dashboard
        () => {
          const cStats = companyStats();
          const curTrip = S.trip ? tr(S.trip) : null;
          const tStats = S.trip ? tot(S.trip) : null;

          return `
            <!-- Whole Company All-Time Summary Header -->
            <div class="card" style="padding:14px;background:linear-gradient(135deg,rgba(56,152,255,0.22),rgba(0,242,213,0.12));border-color:rgba(56,152,255,0.35);margin-bottom:12px">
              <div style="font-size:11px;font-weight:700;color:var(--cy);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px">
                🏢 Company Financial Dashboard
              </div>
              <div style="display:flex;justify-content:space-between;align-items:flex-end">
                <div>
                  <div style="font-size:12px;color:var(--mut)">Total Collected Cash</div>
                  <div style="font-size:24px;font-weight:800;color:var(--gr)">${inr(cStats.allGot)}</div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:11px;color:var(--mut)">Overall Net Profit</div>
                  <div style="font-size:18px;font-weight:800;color:${cStats.allProfit < 0 ? 'var(--rd)' : 'var(--gr)'}">
                    ${inr(cStats.allProfit)}
                  </div>
                </div>
              </div>
              <div class="row" style="border:0;padding:6px 0 0;font-size:11.5px;color:var(--mut)">
                <span>To Be Received: <b class="a">${inr(cStats.allDue)}</b></span>
                <span>Total Company Spend: <b class="r">${inr(cStats.allExp)}</b></span>
              </div>
            </div>

            <!-- Current Active Tour Section -->
            ${!curTrip ? `

                    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">

                      ${e.pay.map(p => `

                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                    <span class="m" style="font-size:11.5px;cursor:pointer" onclick="S.enr=S.enr==='${e.id}'?null:'${e.id}';R()">
                      ${o ? '▲ Hide transactions' : `▼ View ${e.pay.length} transaction${e.pay.length === 1 ? '' : 's'}`}

                      <button class="btn pri s" onclick="openPay('${e.id}')">+ Collect Payment</button>

                        <div class="row" style="padding:4px 0;font-size:12px">

            ${paid.map(e => {

              return `
                <div class="card">

    // Main Render
    function R() {
      // Update trip dropdown
      const sel = $('trip-sel');
      if (D.trips.length === 0) {
        sel.innerHTML = `<option value="">+ New Trip...</option>`;
      } else {
        sel.innerHTML = [...D.trips].sort((a,b)=>b.s.localeCompare(a.s)).map(t => `
          <option value="${t.id}" ${t.id === S.trip ? 'selected' : ''}>${esc(t.n)}</option>
        `).join('') + `<option value="__new__">+ New Trip...</option>`;
      }

      // Render Active View
      const activeViews = VIEWS[S.mode];
      const activeTabFn = activeViews[S.tab] || activeViews[0];
      $('m').innerHTML = activeTabFn();

      // Render Floating Bottom Dock Navigation
      const activeTabs = MODE_TABS[S.mode];
      $('nv').innerHTML = activeTabs.map((t, i) => `
        <button class="${i === S.tab ? 'a' : ''}" onclick="setTab(${i})">
          <b>${t[0]}</b>${t[1]}
        </button>
      `).join('');
    }

    function setTab(i) {
      S.tab = i;
      R();
      $('m').scrollTop = 0;
    }

    // Modal Helpers
    function openM(title, bodyHtml) {
      $('sheet').innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>${title}</h2>
          <button class="icon-btn" onclick="closeM()" style="width:28px;height:28px;font-size:12px">✕</button>
        </div>
        ${bodyHtml}
      `;
      $('ov').classList.add('on');
    }
    function closeM() { $('ov').classList.remove('on'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

    function toast(m) {
      const t = $('toast');
      t.textContent = m;
      t.style.display = 'block';
      clearTimeout(toast.h);
      toast.h = setTimeout(() => t.style.display = 'none', 3000);
    }

    // Modals
    function openNewTrip() {
      openM('Create Tour Departure', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Tour Name *</label><input id="tn" placeholder="e.g. Manali Adventure Expedition"></div>
          <div><label class="m" style="font-size:11.5px">Destination</label><input id="td" placeholder="e.g. Manali, Himachal Pradesh"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:11.5px">Start Date</label><input id="ts" type="date" value="${TODAY}"></div>
            <div style="flex:1"><label class="m" style="font-size:11.5px">End Date</label><input id="te" type="date" value="${TODAY}"></div>
          </div>
          <p id="t_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveNewTrip()">Create Tour</button>
        </div>
      `);
    }

    function saveNewTrip() {
      const n = $('tn').value.trim();
      if (!n) { $('t_err').textContent = 'Trip name is required.'; return; }
      const id = 't' + Date.now();
      const s = $('ts').value || TODAY;
      const e = $('te').value || s;
      D.trips.unshift({ id, n, dest: $('td').value.trim() || 'Tour', s, e, st: 'Open' });
      persist();
      S.trip = id;
      closeM();
      R();
      toast('Tour created.');
    }

    function openEnroll() {
      if (!S.trip) { openNewTrip(); return; }
      openM('Enroll Traveler', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Customer Name *</label><input id="pn" placeholder="Full name"></div>
          <div><label class="m" style="font-size:11.5px">10-Digit Mobile *</label><input id="pp" type="tel" placeholder="e.g. 9876543210"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:11.5px">Package Price (₹) *</label><input id="pb" type="number" placeholder="35000"></div>
            <div style="flex:1"><label class="m" style="font-size:11.5px">Discount (₹)</label><input id="pd" type="number" placeholder="0" value="0"></div>
          </div>
          <p id="p_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveEnroll()">Complete Enrollment</button>
        </div>
      `);
    }

    function saveEnroll() {
      const n = $('pn').value.trim();
      const d = $('pp').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
      const b = Math.round(parseFloat($('pb').value) * 100);
      const x = Math.round((parseFloat($('pd').value) || 0) * 100);
      const err = $('p_err');

      if (!n) { err.textContent = 'Please enter traveler name.'; return; }
      if (!/^[6-9]\d{9}$/.test(d)) { err.textContent = 'Enter a valid 10-digit Indian mobile number.'; return; }
      if (!(b > 0)) { err.textContent = 'Package price must be greater than zero.'; return; }
      if (x < 0 || x >= b) { err.textContent = 'Discount must be less than the price.'; return; }

      let c = D.cust.find(c => c.ph.replace(/\D/g, '').slice(-10) === d);
      if (!c) {
        c = { id: 'c' + Date.now(), n, ph: '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) };
        D.cust.push(c);
      }
      if (D.enr.some(z => z.c === c.id && z.t === S.trip)) {
        err.textContent = c.n + ' is already enrolled on this trip.';
        return;
      }
      D.enr.push({ id: 'e' + Date.now(), c: c.id, t: S.trip, price: b, disc: x, pay: [] });
      persist();
      closeM();
      R();
      toast('Traveler enrolled.');
    }

    function openPay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      openM('Record Payment', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="m" style="font-size:12px">${esc(c.n)} • Remaining Balance: <b class="a">${inr(due(e))}</b></div>
          <div><label class="m" style="font-size:11.5px">Amount in ₹ *</label><input id="p_amt" type="number" placeholder="Enter amount"></div>
          <div>
            <label class="m" style="font-size:11.5px">Payment Mode</label>
            <select id="p_mth">
              <option>UPI</option>
              <option>Cash</option>
              <option>Bank transfer</option>
              <option>Card</option>
            </select>
          </div>
          <div><label class="m" style="font-size:11.5px">Reference / UTR</label><input id="p_ref" placeholder="e.g. UPI-1234"></div>
          <p id="pay_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="savePay('${enrId}')">Record Payment</button>
        </div>
      `);
    }

    function savePay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const a = Math.round(parseFloat($('p_amt').value) * 100);
      const err = $('pay_err');
      if (!(a > 0)) { err.textContent = 'Enter an amount greater than 0.'; return; }
      if (a > due(e)) { err.textContent = `Overpayment blocked: remaining balance is ${inr(due(e))}.`; return; }

      e.pay.push({ d: TODAY, a, m: $('p_mth').value, ref: $('p_ref').value.trim() || 'PAY-' + (e.pay.length + 1) });
      persist();
      closeM();
      R();
      toast('Payment recorded.');
    }

    function openExpense() {
      if (!S.trip) { openNewTrip(); return; }
      openM('Add Trip Expense', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div>
            <label class="m" style="font-size:11.5px">Expense Category</label>
            <select id="x_cat">
              <option>Hotels</option>
              <option>Vehicles</option>
              <option>Camps</option>
              <option>Food</option>
              <option>Permits</option>
              <option>Other facilities</option>
            </select>
          </div>
          <div><label class="m" style="font-size:11.5px">Vendor Name</label><input id="x_ven" placeholder="e.g. Mountain Resort / Cabs"></div>
          <div><label class="m" style="font-size:11.5px">Amount in ₹ *</label><input id="x_amt" type="number" placeholder="Enter amount"></div>
          <p id="x_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveExpense()">Save Expense</button>
        </div>
      `);
    }

    function saveExpense() {
      const a = Math.round(parseFloat($('x_amt').value) * 100);
      const v = $('x_ven').value.trim();
      const err = $('x_err');
      if (!v || !(a > 0)) { err.textContent = 'Please enter vendor and amount.'; return; }

      D.exp.push({ t: S.trip, cat: $('x_cat').value, v, a, d: TODAY });
      persist();
      closeM();
      R();
      toast('Expense saved.');
    }

    // Settings Modal with Widget Customizer
    function openSet() {
      openM('Settings', `
        <!-- Widget Customizer Card -->
        <div class="card" style="padding:14px;background:rgba(28,28,32,0.85);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--cy);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            🎛 Dashboard &amp; Widgets
          </div>
          <div class="row" style="padding:8px 0;cursor:pointer" onclick="openWidgetCustomizer()">
            <div>
              <b style="font-size:13.5px">Customize Home Widgets</b>
              <div class="m" style="font-size:11px">Turn on/off metrics, profit, and cashflow bars</div>
            </div>
            <span class="m" style="font-size:18px">›</span>
          </div>
        </div>

        <!-- Data Backup Card -->
        <div class="card" style="padding:14px;background:rgba(28,28,32,0.85);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--bl);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            Backup &amp; Data Management
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn pri s" style="flex:1" onclick="exportData()">Download JSON</button>
            <label class="btn sec s" style="flex:1;text-align:center">
              Restore JSON
              <input type="file" accept=".json" hidden onchange="importData(this.files[0])">
            </label>
          </div>
          <div style="margin-top:10px">
            <button class="btn sec s" style="width:100%;color:var(--rd)" onclick="clearAllData()">⚠️ Reset All Data (Start Fresh)</button>
          </div>
        </div>
      `);
    }

    // Sub-Modal: Widget Customizer
    function openWidgetCustomizer() {
      openM('Home Widgets Customizer', `
        <div style="display:flex;flex-direction:column;gap:8px">
          <p class="m" style="font-size:12px;margin-bottom:4px">Toggle which widgets appear on the Company Management Home screen:</p>
          
          <label class="row" style="cursor:pointer">
            <span><b>Money Received</b><br><small class="m">Cash collected on active tour</small></span>
            <input type="checkbox" ${WIDGETS.received ? 'checked' : ''} onchange="toggleW('received', this.checked)" style="width:20px;height:20px;accent-color:var(--ac)">
          </label>

          <label class="row" style="cursor:pointer">
            <span><b>To Be Received</b><br><small class="m">Pending customer balance</small></span>
            <input type="checkbox" ${WIDGETS.due ? 'checked' : ''} onchange="toggleW('due', this.checked)" style="width:20px;height:20px;accent-color:var(--ac)">
          </label>

          <label class="row" style="cursor:pointer">
            <span><b>Company Expenses Paid</b><br><small class="m">Operational tour spending</small></span>
            <input type="checkbox" ${WIDGETS.expenses ? 'checked' : ''} onchange="toggleW('expenses', this.checked)" style="width:20px;height:20px;accent-color:var(--ac)">
          </label>

          <label class="row" style="cursor:pointer">
            <span><b>Net Profit / Margin</b><br><small class="m">Tour revenue minus expenses</small></span>
            <input type="checkbox" ${WIDGETS.profit ? 'checked' : ''} onchange="toggleW('profit', this.checked)" style="width:20px;height:20px;accent-color:var(--ac)">
          </label>

          <label class="row" style="cursor:pointer">
            <span><b>Enrolled Travelers Count</b><br><small class="m">Number of registered participants</small></span>
            <input type="checkbox" ${WIDGETS.enrolled ? 'checked' : ''} onchange="toggleW('enrolled', this.checked)" style="width:20px;height:20px;accent-color:var(--ac)">
          </label>

          <label class="row" style="cursor:pointer">
            <span><b>Cashflow Comparison Bar</b><br><small class="m">Visual bar chart of revenue vs spend</small></span>
            <input type="checkbox" ${WIDGETS.cashflow ? 'checked' : ''} onchange="toggleW('cashflow', this.checked)" style="width:20px;height:20px;accent-color:var(--ac)">
          </label>

          <button class="btn pri" style="margin-top:10px" onclick="closeM();R();toast('Widget layout updated.')">Done</button>
        </div>
      `);
    }

    function toggleW(key, val) {
      WIDGETS[key] = val;
      saveWidgets();
    }

    function clearAllData() {
      if (confirm('Clear all tours, customers, payments, and start completely fresh?')) {
        D = { trips: [], cust: [], enr: [], exp: [] };
        persist();
        S.trip = null;
        closeM();
        R();
        toast('All data reset. Ready for fresh entries.');
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'northbound-backup-' + TODAY + '.json';
      a.click();
      toast('Backup file downloaded.');
    }

    function importData(f) {
      if (!f) return;
      f.text().then(t => {
        try {
          const d = JSON.parse(t);
          if (d && Array.isArray(d.trips)) {
            D = d;
            persist();
            S.trip = D.trips[0] ? D.trips[0].id : null;
            closeM();
            R();
            toast('Backup restored.');
          }
        } catch(e) {
          toast('Invalid JSON backup file.');
        }
      });
    }

    function previewSingle(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c), t = tr(e.t), ok = due(e) === 0;
      openM(ok ? 'Paid Receipt' : 'Statement', `
        <div class="paper">
          <div style="display:flex;justify-content:space-between;border-bottom:2px solid #0b1b33;padding-bottom:8px">
            <div><b style="font-size:18px">NorthBound</b><br><small>Travel &amp; Tours</small></div>
            <div style="text-align:right"><b>${ok ? 'RECEIPT' : 'STATEMENT'}</b><br><small>${no(e)}</small></div>
          </div>
          <p style="margin:10px 0 6px"><b>${esc(c.n)}</b> (${c.ph})<br>${esc(t ? t.n : '')} • ${esc(t ? t.dest : '')}</p>
          <div class="pr"><span>Booking Price</span><b>${inr(e.price)}</b></div>
          <div class="pr"><span>Discount</span><b>-${inr(e.disc)}</b></div>
          <div class="pr"><span>Total Paid</span><b class="g">${inr(net(e))}</b></div>
          <div class="pr" style="font-size:15px"><b>Remaining Balance</b><b class="${due(e) > 0 ? 'a' : 'g'}">${inr(due(e))}</b></div>
          ${ok ? '<div class="stamp">PAID</div>' : ''}
        </div>
        <button class="btn pri" onclick="window.print()">Print Receipt</button>
      `);
    }

    function downloadPdf(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const J = window.jspdf && window.jspdf.jsPDF;
      if (!J) { toast('PDF generator not available.'); return; }
      const d = new J({ unit: 'mm', format: 'a4' });
      const c = cu(e.c), t = tr(e.t), dd = due(e), ok = dd === 0;

      d.setFillColor(11, 27, 51);
      d.rect(0, 0, 210, 28, 'F');
      d.setTextColor(255);
      d.setFontSize(20);
      d.setFont('helvetica', 'bold');
      d.text('NorthBound', 14, 18);
      d.setFontSize(11);
      d.text(ok ? 'PAID-IN-FULL RECEIPT' : 'BOOKING STATEMENT', 196, 13, { align: 'right' });
      d.text(no(e), 196, 21, { align: 'right' });

      d.setTextColor(11, 27, 51);
      d.setFontSize(14);
      d.text(c.n, 14, 42);
      d.setFont('helvetica', 'normal');
      d.setFontSize(10);
      d.text(c.ph, 14, 48);
      d.text((t ? t.n : 'Tour') + ' - ' + (t ? t.dest : ''), 14, 56);
      d.text((t ? dt(t.s) : '') + ' to ' + (t ? dt(t.e) : ''), 14, 62);

      let y = 76;
      [['Package Price', e.price], ['Discount', e.disc], ['Payments Received', net(e)], ['Remaining Due', dd]].forEach(([l, v], j) => {
        d.setFont('helvetica', j === 3 ? 'bold' : 'normal');
        d.text(l, 14, y);
        d.text('INR ' + (v/100).toLocaleString('en-IN'), 196, y, { align: 'right' });
        d.setDrawColor(200);
        d.line(14, y + 2, 196, y + 2);
        y += 10;
      });

      if (ok) {
        d.setTextColor(21, 128, 61);
        d.setFont('helvetica', 'bold');
        d.setFontSize(44);
        d.text('PAID', 128, y + 36, { angle: 14 });
      }

      d.save(`NorthBound-${c.n.replace(/\s+/g, '_')}-Receipt.pdf`);
      toast('PDF downloaded.');
    }

    // Init
    R();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
