<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NorthBound Trips - Tour Operations & Financial Management</title>
  <meta name="theme-color" content="#0c101c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <script src="config.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #0c101c;
      --card: rgba(22, 32, 56, 0.88);
      --card-solid: #162038;
      --tx: #ffffff;
      --mut: #91a2bf;
      --line: rgba(255, 255, 255, 0.12);
      --cy: #00f2d5;
      --bl: #3898ff;
      --gr: #2ed573;
      --rd: #ff4757;
      --am: #ffa502;
      --pu: #9b51e0;
      --ac: #00f2d5;
      --ac2: #3898ff;
      --gx: 50%;
      --gy: 25%;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #gemini-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(750px circle at var(--gx) var(--gy), rgba(56, 152, 255, 0.15), rgba(155, 81, 224, 0.12), transparent 65%),
        radial-gradient(circle at 10% 15%, rgba(0, 242, 213, 0.08), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(155, 81, 224, 0.10), transparent 50%),
        var(--bg);
      transition: background 0.3s ease;
    }

    @media (min-width: 481px) {
      #app {
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
      }
    }

    #app {
      max-width: 440px;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* iOS Glassmorphic Top Header */
    header#top-bar {
      padding: max(10px, env(safe-area-inset-top, 10px)) 14px 10px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }
    .brand-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 12px rgba(0, 242, 213, 0.3);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    /* 2-Segment Switch: Company vs Customers */
    .d-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(0, 0, 0, 0.25);
      border: 1.5px solid var(--line);
      padding: 3.5px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .d-switch button {
      background: none;
      border: 0;
      color: var(--mut);
      padding: 7px 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .d-switch button.a {
      background: linear-gradient(135deg, var(--ac), var(--ac2)) !important;
      color: #07101c !important;
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 35%, transparent);
    }

    /* Trip Selector Row - Placed directly UNDER the 2-segment switcher */
    .trip-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    select, .trip-pill-select {
      flex: 1;
      background-color: var(--card-solid) !important;
      border: 1px solid var(--line);
      color: var(--tx) !important;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 12px;
      padding: 8px 10px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }
    select option, .trip-pill-select option {
      background-color: var(--card-solid) !important;
      color: var(--tx) !important;
      font-size: 13px;
      padding: 6px;
    }

    .trip-add-btn {
      background: rgba(56, 152, 255, 0.18);
      border: 1px solid rgba(56, 152, 255, 0.4);
      color: var(--bl);
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .trip-add-btn:active {
      transform: scale(0.94);
    }

    /* Scrollable Content */
    main#m {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 20px;
    }
    main#m::-webkit-scrollbar {
      width: 4px;
    }
    main#m::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* Cards */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* iOS Jiggle / Widget Move & Resize Mode */
    @keyframes iosWiggle {
      0% { transform: rotate(-0.8deg) scale(0.995); }
      50% { transform: rotate(0.8deg) scale(1.005); }
      100% { transform: rotate(-0.8deg) scale(0.995); }
    }
    .ios-editing {
      animation: iosWiggle 0.28s infinite ease-in-out;
      transform-origin: center center;
      position: relative;
      user-select: none;
    }
    .ios-editing:nth-child(even) {
      animation-duration: 0.32s;
      animation-direction: reverse;
    }
    .widget-actions-overlay {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
    }
    .widget-tool-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 8px;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* Floating Bottom Dock Navigation */
    nav#nv {
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 0 10px max(10px, env(safe-area-inset-bottom, 10px));
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 6px 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    nav#nv button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 18px;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    nav#nv button b {
      display: block;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.1;
      transition: transform 0.15s ease;
    }
    nav#nv button:active {
      transform: scale(0.92);
    }
    nav#nv button.a {
      color: var(--tx) !important;
      background: color-mix(in srgb, var(--ac) 24%, var(--card-solid)) !important;
      border: 1px solid color-mix(in srgb, var(--ac) 45%, transparent);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 28%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent);
    }
    nav#nv button.a b {
      filter: drop-shadow(0 0 6px var(--ac));
      transform: translateY(-1px);
    }

    /* iOS Grid for Widgets */
    .ios-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: rgba(22, 32, 56, 0.75);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 88px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .kpi-box.full-span {
      grid-column: span 2;
    }
    .kpi-lbl {
      color: var(--mut);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: -0.5px;
    }
    .kpi-sub {
      color: var(--mut);
      font-size: 11px;
      margin-top: 2px;
    }

    .g { color: var(--gr); }
    .r { color: var(--rd); }
    .m { color: var(--mut); }
    .a { color: var(--am); }
    .c { color: var(--cy); }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill.g { background: rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.35); }
    .pill.r { background: rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.35); }
    .pill.a { background: rgba(255, 165, 2, 0.15); border-color: rgba(255, 165, 2, 0.35); }

    .ios-bar {
      height: 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 8px 0;
    }
    .ios-bar b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cy), var(--bl));
      border-radius: 6px;
    }
    .ios-bar b.exp {
      background: linear-gradient(90deg, var(--am), var(--rd));
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border: 0;
    }

    .btn {
      width: 100%;
      min-height: 42px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.pri {
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #061224;
      box-shadow: 0 4px 16px rgba(0, 242, 213, 0.35);
    }
    .btn.sec {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      border: 1px solid var(--line);
    }
    .btn.wa {
      background: #25D366;
      color: #061224;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }
    .btn.s {
      min-height: 32px;
      padding: 5px 11px;
      font-size: 11.5px;
      width: auto;
    }

    input {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 42px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus {
      border-color: var(--bl);
    }

    /* iOS Bottom Sheet Modals */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .ov.on {
      display: flex;
    }
    .sheet {
      background: var(--card-solid);
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 26px 26px 0 0;
      padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 10px));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: sheetUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      margin: 4px auto 14px;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-head h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* Theme Picker Card in Settings */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .theme-card {
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.16s ease;
    }
    .theme-card.active {
      border-color: var(--ac);
      box-shadow: 0 0 12px color-mix(in srgb, var(--ac) 40%, transparent);
    }
    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin: 0 auto 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Modern Official Paper Bill Styling */
    .paper {
      background: #ffffff;
      color: #0b1b33;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid #dbe3ef;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .bill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f274a;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .bill-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bill-logo-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }
    .bill-meta-right {
      text-align: right;
      font-size: 11.5px;
      color: #475569;
    }
    .bill-meta-right b {
      font-size: 15px;
      color: #0f172a;
    }
    .bill-contact-bar {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
      color: #334155;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .pr {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .pay-history-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }
    .bill-qr-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fafafa;
      border-radius: 12px;
      padding: 10px;
    }
    .bill-qr-box img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
    }
    .bill-qr-text {
      font-size: 11.5px;
      color: #334155;
    }
    .bill-qr-text b {
      font-size: 13px;
      color: #0f172a;
    }

    .stamp {
      position: absolute;
      right: 22px;
      bottom: 22px;
      border: 4px solid #16a34a;
      color: #16a34a;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.12em;
      padding: 3px 16px;
      border-radius: 10px;
      transform: rotate(-12deg);
      opacity: 0.88;
      pointer-events: none;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      background: rgba(18, 26, 46, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 60;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printable-bill-area, #printable-bill-area * {
        visibility: visible !important;
      }
      #printable-bill-area {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 20px !important;
        background: #ffffff !important;
      }
      .paper {
        border: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <div id="gemini-bg" aria-hidden="true"></div>

  <div id="app">
    <!-- Header: Logo, 2-segment switcher, and Trip Selector placed directly below -->
    <header id="top-bar">

    // Main Render
    function R() {
      const sel = $('trip-sel');
      if (D.trips.length === 0) {
        sel.innerHTML = `<option value="">+ New Departure...</option>`;
      } else {
        sel.innerHTML = [...D.trips].sort((a,b)=>b.s.localeCompare(a.s)).map(t => `
          <option value="${t.id}" ${t.id === S.trip ? 'selected' : ''}>${esc(t.n)}</option>
        `).join('') + `<option value="__new__">+ New Departure...</option>`;
      }

      const activeViews = VIEWS[S.mode];
      const activeTabFn = activeViews[S.tab] || activeViews[0];
      $('m').innerHTML = activeTabFn();

      const activeTabs = MODE_TABS[S.mode];
      $('nv').innerHTML = activeTabs.map((t, i) => `
        <button class="${i === S.tab ? 'a' : ''}" onclick="setTab(${i})">
          <b>${t[0]}</b>${t[1]}
        </button>
      `).join('');
    }

    function setTab(i) {
      S.tab = i;
      R();
      $('m').scrollTop = 0;
    }

    function moveWidget(idx, dir) {
      const enabledList = WIDGET_CONFIG.filter(w => w.enabled);
      const target = idx + dir;
      if (target < 0 || target >= enabledList.length) return;
      const itemA = enabledList[idx];
      const itemB = enabledList[target];
      const idxA = WIDGET_CONFIG.indexOf(itemA);
      const idxB = WIDGET_CONFIG.indexOf(itemB);
      WIDGET_CONFIG[idxA] = itemB;
      WIDGET_CONFIG[idxB] = itemA;
      saveWidgetConfig();
      R();
    }

    function toggleWidgetSize(idx) {
      const enabledList = WIDGET_CONFIG.filter(w => w.enabled);
      const item = enabledList[idx];
      if (item) {
        item.full = !item.full;
        saveWidgetConfig();
        R();
      }
    }

    function saveEnroll() {
      const n = $('pn').value.trim();
      const d = $('pp').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
      const b = Math.round(parseFloat($('pb').value) * 100);
      const x = Math.round((parseFloat($('pd').value) || 0) * 100);
      const err = $('p_err');

      if (!n) { err.textContent = 'Please enter traveler name.'; return; }
      if (!/^[6-9]\d{9}$/.test(d)) { err.textContent = 'Enter a valid 10-digit Indian mobile number.'; return; }
      if (!(b > 0)) { err.textContent = 'Package price must be greater than zero.'; return; }
      if (x < 0 || x >= b) { err.textContent = 'Discount must be less than the price.'; return; }

      let c = D.cust.find(c => c.ph.replace(/\D/g, '').slice(-10) === d);
      if (!c) {
        c = { id: 'c' + Date.now(), n, ph: '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) };
        D.cust.push(c);
      }
      if (D.enr.some(z => z.c === c.id && z.t === S.trip)) {
        err.textContent = c.n + ' is already enrolled on this trip.';
        return;
      }
      D.enr.push({ id: 'e' + Date.now(), c: c.id, t: S.trip, price: b, disc: x, pay: [] });
      persist();
      closeM();
      R();
      toast('Traveler enrolled.');
    }

    function sendStaffInvite() {
      const email = $('inv_email').value.trim().toLowerCase();
      const role = $('inv_role').value;
      if (!email || !email.includes('@')) {
        toast('Please enter a valid Google email.');

    function loginWithGoogle() {
      if (fbAuth) {
        const provider = new firebase.auth.GoogleAuthProvider();
        fbAuth.signInWithPopup(provider)
          .then(result => {
            const email = (result.user.email || '').toLowerCase();
            handleUserAccess(email);
          })
          .catch(err => {
            toast('Google Sign-In: ' + err.message);
          });
      } else {
        const email = prompt('Enter Google Gmail address to simulate login (Add Firebase keys in config.js for 1-click popup):', currentUser.email);
        if (email) handleUserAccess(email.trim().toLowerCase());
      }
    }

    function handleUserAccess(email) {
      if (!D.ownerEmail) {
        D.ownerEmail = email;
        currentUser = { email: email, role: 'owner' };
      } else if (email === D.ownerEmail.toLowerCase()) {
        currentUser = { email: email, role: 'owner' };
      } else {
        const inv = (D.invitations || []).find(x => x.email.toLowerCase() === email);
        if (inv) {
          currentUser = { email: email, role: inv.role };
          inv.status = 'active';
        } else {
          currentUser = { email: email, role: 'guest_blocked' };
        }
      }
      localStorage.setItem('nb_active_user', JSON.stringify(currentUser));
      persist();
      closeM();
      R();
      if (currentUser.role === 'guest_blocked') {
        toast('Access restricted: Ask owner to invite ' + email);
      } else {
        toast(`Signed in as ${currentUser.email} (${currentUser.role})`);
      }
    }

    function signOutUser() {
      if (fbAuth) fbAuth.signOut().catch(() => {});
      currentUser = { email: 'guest@example.com', role: 'guest_blocked' };
      localStorage.removeItem('nb_active_user');
      closeM();
      R();
      toast('Signed out.');
    }

    function switchGoogleUser() {
      loginWithGoogle();
    }

        });
      } else {

          R();
          toast('💾 Local auto-saved. Add Firebase keys in config.js for cloud sync.');
        }, 500);
      }
    }

              <div class="pay-history-item" style="background:#f8fafc;color:#0f172a;border-color:#e2e8f0;padding:7px 10px;margin-top:4px">
                <span><b>${pIdx + 1}${pIdx === 0 ? 'st' : pIdx === 1 ? 'nd' : pIdx === 2 ? 'rd' : 'th'} Installment</b>: ${inr(p.a)}</span>
                <b style="color:#475569">Date: ${dt(p.d)}</b>
              </div>
            `).join('') || '<div style="font-size:12px;color:#94a3b8;padding:4px 0">No payments logged yet.</div>'}
          </div>

          <!-- Updated Square PhonePe Payment QR Code -->
          ${!ok ? `
            <div class="bill-qr-box">
              <img src="${QR_URI}" alt="PhonePe QR Code">
              <div class="bill-qr-text">
                <b style="display:block;margin-bottom:2px">Instant UPI Payment</b>
                <div>Scan this PhonePe QR code to pay remaining dues of <b style="color:#b45309">${inr(due(e))}</b> directly via GPay / PhonePe / Paytm UPI.</div>
              </div>
            </div>
          ` : ''}

          ${ok ? '<div class="stamp">PAID</div>' : ''}
        </div>
      `;
    }

    // OFFICIAL BILL PREVIEW MODAL
    function previewBill(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c), ok = due(e) === 0;

      openM(ok ? 'Paid-in-Full Receipt' : 'Booking Billing Statement', `
        ${getBillHtml(enrId)}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
          <button class="btn pri s" onclick="window.print()">🖨️ Print Bill</button>
          <button class="btn sec s" onclick="savePdfDirect('${enrId}')">📥 Save PDF</button>
        </div>
        <div style="margin-top:8px">
          <button class="btn wa" onclick="shareOnWhatsApp('${enrId}')">📲 Share on WhatsApp (Auto-Download)</button>
        </div>
      `);
    }

    // SAVE PDF IDENTICAL TO PREVIEW: Captures the preview DOM with html2canvas and puts it in jsPDF
    async function savePdfDirect(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      const el = document.getElementById('printable-bill-area');
      if (!el) {
        toast('Open preview first.');
        return;
      }
      toast('Generating identical PDF...');

      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, logging: false });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth() - 20;
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        pdf.addImage(imgData, 'JPEG', 10, 10, pdfWidth, pdfHeight);
        const filename = `NorthBound-${c.n.replace(/\s+/g, '_')}-Bill.pdf`;
        pdf.save(filename);
        toast('PDF saved successfully!');
        return pdf;
      } catch (err) {
        console.error(err);
        window.print();
      }
    }

    // SHARE ON WHATSAPP: Auto-downloads the PDF and opens WhatsApp with pre-filled message
    async function shareOnWhatsApp(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      const t = tr(e.t);
      const isPaid = due(e) === 0;

      // 1. Auto download the identical PDF
      await savePdfDirect(enrId);

      // 2. Prepare pre-filled message
      let phoneNum = (c.ph || '').replace(/\D/g, '');
      if (phoneNum.length === 10) phoneNum = '91' + phoneNum;

      const msg = `Hello ${c.n}, here is your official ${isPaid ? 'Paid-in-Full Receipt' : 'Booking Billing Statement'} from ${COMPANY_NAME} for ${t ? t.n : 'Tour'}. Total Paid: ${inr(net(e))}. Remaining Due: ${inr(due(e))}. Your PDF receipt has been generated.`;
      const waUrl = `https://api.whatsapp.com/send?phone=${phoneNum}&text=${encodeURIComponent(msg)}`;

      // 3. Open WhatsApp
      setTimeout(() => {
        window.open(waUrl, '_blank');
        toast('PDF downloaded. Attaching in WhatsApp...');
      }, 700);
    }

    // SETTINGS MODAL WITH 6 APPLE IOS THEMES, WIDGETS, AND CLOUD BACKUP
    function openSet() {
      openM('Settings', `
        <!-- Theme Selection: 6 Apple iOS Themes -->
        <div class="card" style="padding:14px;background:rgba(255,255,255,0.04);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--cy);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">
            🎨 Apple iOS Themes (6 Styles)
          </div>
          <div class="theme-grid">
            ${Object.keys(IOS_THEMES).map(tKey => {
              const t = IOS_THEMES[tKey];
              return `
                <div class="theme-card ${tKey === CURRENT_THEME ? 'active' : ''}" onclick="applyTheme('${tKey}');openSet();toast('${t.name} active!')">
                  <div class="theme-dot" style="background:${t.dot}"></div>
                  <div style="font-size:11px;font-weight:700">${t.name}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Widget Customizer Card -->
        <div class="card" style="padding:14px;background:rgba(255,255,255,0.04);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            🎛 Dashboard &amp; Widgets
          </div>
          <div class="row" style="padding:6px 0;cursor:pointer" onclick="closeM();toggleJiggle()">
            <div>
              <b style="font-size:13.5px">Edit &amp; Reorder Widgets</b>
              <div class="m" style="font-size:11px">Enter wiggle mode to move (▲/▼) and resize (1x1/2x1)</div>
            </div>
            <span class="m" style="font-size:18px">›</span>
          </div>
        </div>

        <!-- Cloud Sync & Data Loss Safety -->
        <div class="card" style="padding:14px;background:rgba(255,255,255,0.04);margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--bl);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">
            ☁️ Cloud Sync &amp; Backup Safety
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn pri s" style="flex:1" onclick="syncCloudNow()">Sync to Cloud</button>
            <button class="btn sec s" style="flex:1" onclick="exportData()">Export Backup</button>
          </div>
          <div style="margin-top:8px">
            <label class="btn sec s" style="width:100%;text-align:center">
              Restore JSON Backup
              <input type="file" accept=".json" hidden onchange="importData(this.files[0])">
            </label>
          </div>
          <div style="margin-top:10px">
            <button class="btn sec s" style="width:100%;color:var(--rd)" onclick="clearAllData()">⚠️ Reset All Data (Start Fresh)</button>
          </div>
        </div>
      `);
    }

    function clearAllData() {
      if (confirm('Clear all tours, customers, payments, and start completely fresh?')) {
        D = { trips: [], cust: [], enr: [], exp: [], invitations: [], ownerEmail: 'owner@northbound.co.in' };
        persist();
        S.trip = null;
        closeM();
        R();
        toast('All data reset.');
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'northbound-trips-backup-' + TODAY + '.json';
      a.click();
      toast('Emergency backup downloaded.');
    }

    function importData(f) {
      if (!f) return;
      f.text().then(t => {
        try {
          const d = JSON.parse(t);
          if (d && Array.isArray(d.trips)) {
            D = d;
            persist();
            S.trip = D.trips[0] ? D.trips[0].id : null;
            closeM();
            R();
            toast('Backup restored.');
          }
        } catch(e) {
          toast('Invalid JSON backup file.');
        }
      });
    }

    // Init
    R();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
