  <style>
    :root {
      --bg: #0c101c;
      --card: rgba(22, 32, 56, 0.88);
      --card-solid: #162038;
      --tx: #ffffff;
      --mut: #91a2bf;
      --line: rgba(255, 255, 255, 0.12);
      --cy: #00f2d5;
      --bl: #3898ff;
      --gr: #2ed573;
      --rd: #ff4757;
      --am: #ffa502;
      --pu: #9b51e0;
      --ac: #00f2d5;
      --ac2: #3898ff;
      --gx: 50%;
      --gy: 25%;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #gemini-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(750px circle at var(--gx) var(--gy), rgba(56, 152, 255, 0.15), rgba(155, 81, 224, 0.12), transparent 65%),
        radial-gradient(circle at 10% 15%, rgba(0, 242, 213, 0.08), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(155, 81, 224, 0.10), transparent 50%),
        var(--bg);
      transition: background 0.3s ease;
    }

    @media (min-width: 481px) {
      #app {
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
      }
    }

    #app {
      max-width: 440px;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* iOS Glassmorphic Top Header */
    header#top-bar {
      padding: max(8px, env(safe-area-inset-top, 8px)) 14px 9px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }
    .brand-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 12px rgba(0, 242, 213, 0.3);
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    /* 2-Segment Switch: Company vs Customers */
    .d-switch {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background: rgba(0, 0, 0, 0.25);
      border: 1.5px solid var(--line);
      padding: 3.5px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .pill.cancelled {
      background: rgba(255, 71, 87, 0.2) !important;
      border-color: rgba(255, 71, 87, 0.5) !important;
      color: #ff4757 !important;
    }
    .journey-paper {
      background: #ffffff;
      color: #0b1b33;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      border: 2px solid var(--cy);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .d-switch button {
      background: none;
      border: 0;
      color: var(--mut);
      padding: 7px 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .d-switch button.a {
      background: linear-gradient(135deg, var(--ac), var(--ac2)) !important;
      color: #07101c !important;
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 35%, transparent);
    }

    /* Trip Selector Row - Placed directly UNDER the 2-segment switcher */
    .trip-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    select, .trip-pill-select {
      flex: 1;
      background-color: var(--card-solid) !important;
      border: 1px solid var(--line);
      color: var(--tx) !important;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 12px;
      padding: 8px 10px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }
    select option, .trip-pill-select option {
      background-color: var(--card-solid) !important;
      color: var(--tx) !important;
      font-size: 13px;
      padding: 6px;
    }

    .trip-add-btn {
      background: rgba(56, 152, 255, 0.18);
      border: 1px solid rgba(56, 152, 255, 0.4);
      color: var(--bl);
      font-size: 12px;
      font-weight: 700;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .trip-add-btn:active {
      transform: scale(0.94);
    }

    /* Scrollable Content */
    main#m {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 20px;
      animation: iosViewFade 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    main#m::-webkit-scrollbar {
      width: 4px;
    }
    main#m::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* Cards */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* iOS Jiggle / Widget Move & Resize Mode */
    @keyframes iosWiggle {
      0% { transform: rotate(-0.8deg) scale(0.995); }
      50% { transform: rotate(0.8deg) scale(1.005); }
      100% { transform: rotate(-0.8deg) scale(0.995); }
    }
    .ios-editing {
      animation: iosWiggle 0.28s infinite ease-in-out;
      transform-origin: center center;
      position: relative;
      user-select: none;
    }
    .ios-editing:nth-child(even) {
      animation-duration: 0.32s;
      animation-direction: reverse;
    }
    .widget-actions-overlay {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
    }
    .widget-tool-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      border-radius: 8px;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* Floating Bottom Dock Navigation */
    nav#nv {
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 0 12px max(10px, env(safe-area-inset-bottom, 10px));
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: var(--card);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      padding: 6px 5px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    nav#nv button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--mut);
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 18px;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    nav#nv button b {
      display: block;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.1;
      transition: transform 0.15s ease;
    }
    nav#nv button:active {
      transform: scale(0.92);
    }
    nav#nv button.a {
      color: var(--tx) !important;
      background: color-mix(in srgb, var(--ac) 24%, var(--card-solid)) !important;
      border: 1px solid color-mix(in srgb, var(--ac) 45%, transparent);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 28%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent);
    }
    nav#nv button.a b {
      filter: drop-shadow(0 2px 8px var(--ac));
      transform: translateY(-2px) scale(1.1);
    }

    
    /* Modern iOS View & Micro Animations */
    @keyframes iosViewFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.5; }
    }
    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gr);
      box-shadow: 0 0 8px var(--gr);
      animation: pulseLive 2s infinite ease-in-out;
      margin-right: 5px;
      vertical-align: middle;
    }
    .widget-icon-pill {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }
    .traveler-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #061224;
      box-shadow: 0 3px 10px color-mix(in srgb, var(--ac) 35%, transparent);
      flex-shrink: 0;
      letter-spacing: -0.5px;
    }

    /* iOS Grid for Widgets */
    .ios-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: linear-gradient(145deg, color-mix(in srgb, var(--card) 95%, rgba(255,255,255,0.08)), var(--card-solid));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 94px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kpi-box:hover {
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .kpi-box:active {
      transform: scale(0.98);
    }
    .kpi-box.full-span {
      grid-column: span 2;
    }
    .kpi-lbl {
      color: var(--mut);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-val {
      font-size: 21px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: -0.5px;
    }
    .kpi-sub {
      color: var(--mut);
      font-size: 11px;
      margin-top: 2px;
    }

    .g { color: var(--gr); }
    .r { color: var(--rd); }
    .m { color: var(--mut); }
    .a { color: var(--am); }
    .c { color: var(--cy); }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill.g { background: rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.35); }
    .pill.r { background: rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.35); }
    .pill.a { background: rgba(255, 165, 2, 0.15); border-color: rgba(255, 165, 2, 0.35); }

    .ios-bar {
      height: 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 8px 0;
    }
    .ios-bar b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cy), var(--bl));
      border-radius: 6px;
    }
    .ios-bar b.exp {
      background: linear-gradient(90deg, var(--am), var(--rd));
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border: 0;
    }

    .btn {
      width: 100%;
      min-height: 42px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.pri {
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #061224;
      box-shadow: 0 4px 16px rgba(0, 242, 213, 0.35);
    }
    .btn.sec {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      border: 1px solid var(--line);
    }
    .btn.wa {
      background: #25D366;
      color: #061224;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }
    .btn.s {
      min-height: 32px;
      padding: 5px 11px;
      font-size: 11.5px;
      width: auto;
    }

    input {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 42px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus {
      border-color: var(--bl);
    }

    /* iOS Bottom Sheet Modals */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .ov.on {
      display: flex;
    }
    .sheet {
      background: var(--card-solid);
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 26px 26px 0 0;
      padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 10px));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: sheetUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      margin: 4px auto 14px;
    }
    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-head h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* Theme Picker Card in Settings */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    @media (max-width: 380px) {
      .theme-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .theme-card {
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.16s ease;
    }
    .theme-card.active {
      border-color: var(--ac);
      box-shadow: 0 0 12px color-mix(in srgb, var(--ac) 40%, transparent);
    }
    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin: 0 auto 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Modern Official Paper Bill Styling */
    .paper {
      background: #ffffff;
      color: #0b1b33;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid #dbe3ef;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .bill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f274a;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .bill-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bill-logo-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
    }
    .bill-meta-right {
      text-align: right;
      font-size: 11.5px;
      color: #475569;
    }
    .bill-meta-right b {
      font-size: 15px;
      color: #0f172a;
    }
    .bill-contact-bar {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 11px;
      color: #334155;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .pr {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }
    .pay-history-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }
    .bill-qr-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fafafa;
      border-radius: 12px;
      padding: 10px;
    }
    .bill-qr-box img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
    }
    .bill-qr-text {
      font-size: 11.5px;
      color: #334155;
    }
    .bill-qr-text b {
      font-size: 13px;
      color: #0f172a;
    }

    .stamp {
      position: absolute;
      right: 22px;
      bottom: 22px;
      border: 4px solid #16a34a;
      color: #16a34a;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.12em;
      padding: 3px 16px;
      border-radius: 10px;
      transform: rotate(-12deg);
      opacity: 0.88;
      pointer-events: none;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      background: rgba(18, 26, 46, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 60;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
    }

    @media print {
      body * { visibility: hidden !important; }
      #printable-bill-area, #printable-bill-area *,
      #printable-journey-area, #printable-journey-area * {
        visibility: visible !important;
      }
      #printable-bill-area, #printable-journey-area {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 20px !important;
        background: #ffffff !important;
      }
      .paper {
        border: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

    async function loginWithGoogle() {
      if (!fbAuth) {
        openSignInModal();
        return;
      }
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await fbAuth.signInWithPopup(provider);
      } catch(err) {
        console.warn('Google sign-in popup:', err);
        if (err.code === 'auth/popup-blocked') {
          fbAuth.signInWithRedirect(provider).catch(() => openSignInModal());
        } else {
          openSignInModal(err.message);
        }
      }
    }

    async function sendPhoneOtp(rawPhone, pfx = '') {
      if (!fbAuth) {
        toast('Firebase Auth is not configured with an API key.');
        return;
      }
      initRecaptcha();
      let cleanPhone = (rawPhone || '').trim();
      if (!cleanPhone.startsWith('+')) {
        cleanPhone = '+91' + cleanPhone.replace(/\D/g, '').slice(-10);
      }
      try {
        toast('Sending OTP to ' + cleanPhone + '...');
        phoneConfirmationResult = await fbAuth.signInWithPhoneNumber(cleanPhone, appRecaptchaVerifier);
        toast('✓ 6-Digit OTP sent to ' + cleanPhone);
        if ($(pfx + 'otp_step_1')) $(pfx + 'otp_step_1').style.display = 'none';
        if ($(pfx + 'otp_step_2')) $(pfx + 'otp_step_2').style.display = 'block';
        if ($(pfx + 'otp_input')) $(pfx + 'otp_input').focus();
      } catch(err) {
        console.error('Phone OTP error:', err);
        const errEl = $(pfx + 'auth_err_box');
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent = 'OTP Error: ' + (err.message || 'Check phone number format (+91)');
        }
        toast('Error sending OTP.');
      }
    }

    async function verifyPhoneOtp(code, pfx = '') {
      if (!phoneConfirmationResult) {
        toast('No OTP pending. Please request OTP first.');
        return;
      }
      try {
        toast('Verifying OTP code...');
        await phoneConfirmationResult.confirm(code);
        closeM();
        toast('✓ Phone number verified successfully!');
      } catch(err) {
        console.error('Verify OTP error:', err);
        const errEl = $(pfx + 'auth_err_box');
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent = 'Invalid OTP code. Please check and try again.';
        }
      }
    }

    async function submitCreateCompany() {
      const name = ($('onboard_comp_name') ? $('onboard_comp_name').value.trim() : '');
      const err = $('onboard_err');
      if (!name) {
        if (err) err.textContent = 'Please enter your company name.';
        return;
      }

      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 18) || 'tour_co';
      const newCompId = 'comp_' + slug + '_' + Math.random().toString(36).slice(2, 6);
      const now = new Date();
      const trialEndsAt = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);

      const user = fbAuth ? fbAuth.currentUser : null;
      const uid = user ? user.uid : ('u_' + Date.now());

      const companyMeta = {
        companyId: newCompId,
        companyName: name,
        tagline: 'Har Safar Ka Hisaab',
        upiId: '',
        address: '',
        phone: user ? (user.phoneNumber || '') : '',
        instagramHandle: '',
        contactEmail: user ? (user.email || '') : '',
        ownerEmail: user ? (user.email || '') : '',
        logoUri: '',
        qrUri: '',
        plan: 'trial',
        trialEndsAt: trialEndsAt,
        createdAt: typeof firebase !== 'undefined' ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString(),
        deleted: false
      };

      const userProfile = {
        uid: uid,
        companyId: newCompId,
        role: 'owner',
        email: user ? (user.email || '') : '',
        phone: user ? (user.phoneNumber || '') : '',
        createdAt: typeof firebase !== 'undefined' ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
      };

      if (fbDb && user) {
        try {
          await fbDb.collection('companies').doc(newCompId).set(companyMeta);
          await fbDb.collection('users').doc(uid).set(userProfile);
        } catch(e) {
          console.warn('Firestore company onboarding error:', e);
        }
      }

      CURRENT_COMPANY_ID = newCompId;
      localStorage.setItem('nb_active_company_id_v7', newCompId);
      currentUser = {
        uid: uid,
        email: user ? (user.email || '') : '',
        phone: user ? (user.phoneNumber || '') : '',
        name: name + ' Owner',
        role: 'owner',
        companyId: newCompId,
        isGuest: false
      };
      localStorage.setItem('nb_active_user', JSON.stringify(currentUser));

      // New company starts EMPTY - 0 trips, 0 customers, NO demo data! (Point 3)
      D = {
        companyId: newCompId,
        companyName: name,
        trips: [],
        cust: [],
        enr: [],
        exp: [],
        invitations: [],
        companyProfile: companyMeta,
        lastSync: 'Now'
      };
      persist();
      closeM();
      subscribeToCompanySubcollections(newCompId);
      syncBrandingConstants();
      R();
      toast(`🎉 Company "${name}" created! You have 30 days free trial.`);
    }

    // ================= REALTIME SUBCOLLECTION SUBSCRIPTION (Point 2, 4) =================
    let subcollectionUnsubscribers = [];

    function unsubscribeAllSubcollections() {
      subcollectionUnsubscribers.forEach(u => {
        try { u(); } catch(e) {}
      });
      subcollectionUnsubscribers = [];
    }

    function subscribeToCompanySubcollections(companyId) {
      if (!fbDb || !companyId) return;
      unsubscribeAllSubcollections();

      const compRef = fbDb.collection('companies').doc(companyId);

      // 1. Company Metadata Listener (plan, trialEndsAt, branding)
      const uCompany = compRef.onSnapshot(doc => {
        if (doc.exists) {
          const meta = doc.data();
          if (meta) {
            D.companyProfile = meta;
            D.companyName = meta.companyName || D.companyName;
            syncBrandingConstants();
            R();
          }
        }
      }, err => console.warn('Company metadata listener:', err));
      subcollectionUnsubscribers.push(uCompany);

      // Temporary normalized memory map for payments
      let currentPayments = [];

      function reassembleState() {
        // Associate payments into enrollments' pay arrays
        (D.enr || []).forEach(e => {
          e.pay = currentPayments.filter(p => p.enrId === e.id);
        });
        persist();
        R();
      }

      // 2. Trips Subcollection
      const uTrips = compRef.collection('trips')
        .where('companyId', '==', companyId)
        .where('deleted', '==', false)
        .onSnapshot(snap => {
          D.trips = snap.docs.map(d => d.data());
          if (!S.trip && D.trips.length > 0) S.trip = D.trips[0].id;
          reassembleState();
        }, err => console.warn('Trips subcollection error:', err));
      subcollectionUnsubscribers.push(uTrips);

      // 3. Customers Subcollection
      const uCust = compRef.collection('customers')
        .where('companyId', '==', companyId)
        .where('deleted', '==', false)
        .onSnapshot(snap => {
          D.cust = snap.docs.map(d => d.data());
          reassembleState();
        }, err => console.warn('Customers subcollection error:', err));
      subcollectionUnsubscribers.push(uCust);

      // 4. Enrollments Subcollection
      const uEnr = compRef.collection('enrollments')
        .where('companyId', '==', companyId)
        .where('deleted', '==', false)
        .onSnapshot(snap => {
          D.enr = snap.docs.map(d => d.data());
          reassembleState();
        }, err => console.warn('Enrollments subcollection error:', err));
      subcollectionUnsubscribers.push(uEnr);

      // 5. Payments Subcollection (Normalized subcollection with UTR & timestamps)
      const uPay = compRef.collection('payments')
        .where('companyId', '==', companyId)
        .where('deleted', '==', false)
        .onSnapshot(snap => {
          currentPayments = snap.docs.map(d => d.data());
          reassembleState();
        }, err => console.warn('Payments subcollection error:', err));
      subcollectionUnsubscribers.push(uPay);

      // 6. Expenses Subcollection
      const uExp = compRef.collection('expenses')
        .where('companyId', '==', companyId)
        .where('deleted', '==', false)
        .onSnapshot(snap => {
          D.exp = snap.docs.map(d => d.data());
          reassembleState();
        }, err => console.warn('Expenses subcollection error:', err));
      subcollectionUnsubscribers.push(uExp);
    }

    // Auth State Listener: Auto-route to company or show onboarding
    if (fbAuth) {
      fbAuth.onAuthStateChanged(async user => {
        if (user) {
          try {
            // Query users/{uid} to get companyId and role (Point 3)
            const userSnap = await fbDb.collection('users').doc(user.uid).get();
            if (userSnap.exists && userSnap.data() && userSnap.data().companyId) {
              const uData = userSnap.data();
              CURRENT_COMPANY_ID = uData.companyId;
              localStorage.setItem('nb_active_company_id_v7', CURRENT_COMPANY_ID);
              currentUser = {
                uid: user.uid,
                email: user.email || '',
                phone: user.phoneNumber || '',
                role: uData.role || 'staff',
                companyId: CURRENT_COMPANY_ID,
                isGuest: false
              };
              localStorage.setItem('nb_active_user', JSON.stringify(currentUser));
              D = loadCompanyStore(CURRENT_COMPANY_ID);
              subscribeToCompanySubcollections(CURRENT_COMPANY_ID);
              syncBrandingConstants();
              R();
              toast(`Signed in as ${currentUser.role.toUpperCase()} (${user.email || user.phoneNumber})`);
            } else {
              // No company linked to this real user account: Show Create Company screen (Point 3)
              currentUser = {
                uid: user.uid,
                email: user.email || '',
                phone: user.phoneNumber || '',
                role: 'owner',
                companyId: null,
                isGuest: false
              };
              openCreateCompanyModal();
            }
          } catch(err) {
            console.warn('Auth lookup error:', err);
          }
        } else {
          // Not logged in: Default to local test state or show Sign In modal
          if (!currentUser) {
            currentUser = {
              uid: 'demo_owner_a',
              email: 'owner.a@northbound.co.in',
              role: 'owner',
              companyId: 'comp_northbound_a',
              isGuest: true
            };
          }
        }
        R();
      });
    }

// QRBitBuffer.js
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};



// QRPolynomial.js
function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};



// QR8bitByte.js
function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

var QRUtil = {

    PATTERN_POSITION_TABLE : [
        [],
        [6, 18],
        [6, 22],
        [6, 26],
        [6, 30],
        [6, 34],
        [6, 22, 38],
        [6, 24, 42],

        [6, 30, 54],        
        [6, 32, 58],
        [6, 34, 62],
        [6, 26, 46, 66],
        [6, 26, 48, 70],
        [6, 26, 50, 74],
        [6, 30, 54, 78],
        [6, 30, 56, 82],
        [6, 30, 58, 86],
        [6, 34, 62, 90],
        [6, 28, 50, 72, 94],
        [6, 26, 50, 74, 98],
        [6, 30, 54, 78, 102],
        [6, 28, 54, 80, 106],
        [6, 32, 58, 84, 110],
        [6, 30, 58, 86, 114],
        [6, 34, 62, 90, 118],
        [6, 26, 50, 74, 98, 122],
        [6, 30, 54, 78, 102, 126],
        [6, 26, 52, 78, 104, 130],
        [6, 30, 56, 82, 108, 134],
        [6, 34, 60, 86, 112, 138],
        [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146],
        [6, 30, 54, 78, 102, 126, 150],
        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {

    function getOrGenerateQrCode(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      if (!e) return '';
      if (!e.boarding_qr_code) {
        const c = cu(e.c);
        const t = tr(e.t);
        const token = Math.random().toString(36).substring(2, 8).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase();
        const cId = (c ? c.id : e.c).toUpperCase();
        const tId = (t ? t.id : e.t).toUpperCase();
        // QR data: customerId + tripId + unique secret token (e.g. CUST-C1|TRIP-T1|XYZ789)
        e.boarding_qr_code = `CUST-${cId}|TRIP-${tId}|${token}`;
        persist();
      }
      return e.boarding_qr_code;
    }

    function processScannedQrCode(qrData) {
      if (!qrData || typeof qrData !== 'string') {
        showQrScanResult('Invalid QR code format.', 'error');
        return;
      }

      const trimmed = qrData.trim();
      let matchEnr = D.enr.find(e => e.boarding_qr_code && e.boarding_qr_code.trim() === trimmed);

      // Check format parsing if not directly matched by full string
      if (!matchEnr) {
        const parts = trimmed.split('|');
        if (parts.length >= 2) {
          const rawC = parts[0].replace(/^CUST-/i, '').toLowerCase();
          const rawT = parts[1].replace(/^TRIP-/i, '').toLowerCase();

          matchEnr = D.enr.find(e => {
            const cMatch = e.c.toLowerCase() === rawC || (cu(e.c) && cu(e.c).id.toLowerCase() === rawC);
            const tMatch = e.t.toLowerCase() === rawT || (tr(e.t) && tr(e.t).id.toLowerCase() === rawT);
            return cMatch && tMatch;
          });
        }
      }

      // Check: QR belongs to this trip? Customer is enrolled in this trip?
      if (!matchEnr) {
        showQrScanResult('Invalid QR: Traveler not found or invalid QR code.', 'error');
        return;
      }

      if (matchEnr.t !== S.trip) {
        const wrongTrip = tr(matchEnr.t);
        const currTrip = tr(S.trip);
        showQrScanResult(`Invalid QR: This QR belongs to "${wrongTrip ? wrongTrip.n : matchEnr.t}", not this departure (${currTrip ? currTrip.n : S.trip}).`, 'error');
        return;
      }

      // Check: QR already scanned or not? If already scanned, show "Already marked Present"
      if (matchEnr.boarding_scanned_at || matchEnr.b_st === 'present') {
        const c = cu(matchEnr.c);
        const timeInfo = matchEnr.b_dt || 'Earlier';
        showQrScanResult(`Already marked Present: ${c ? c.n : 'Traveler'} was already checked in (${timeInfo}). Duplicate scan blocked.`, 'already');
        return;
      }

      // If valid and not scanned before, auto-mark that customer as Present with timestamp (example: Present - 7:12 AM, Scanned)
      const c = cu(matchEnr.c);
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      const formattedTimestamp = `Present - ${timeStr}, Scanned`;

      matchEnr.b_st = 'present';
      matchEnr.b_dt = formattedTimestamp;
      matchEnr.boarding_scanned_at = now.toISOString();
      if (!matchEnr.boarding_qr_code) {
        matchEnr.boarding_qr_code = trimmed;
      }

      // Save boarding_scanned_at + boarding_qr_code in database
      persist();
      R();

      showQrScanResult(`✓ Check-in Verified! ${c ? c.n : 'Traveler'} marked ${formattedTimestamp}.`, 'success', matchEnr.id);
      toast(`✓ ${c ? c.n : 'Traveler'}: ${formattedTimestamp}`);
    }

    // Helper to generate identical PDF scaled properly to fit without cutting off QR code
    async function generatePdfFromElement(el, filename, autoDownload = true) {
      const canvas = await html2canvas(el, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const printWidth = pageWidth - (margin * 2);
      const printHeight = (canvas.height * printWidth) / canvas.width;

      if (printHeight <= pageHeight - (margin * 2)) {
        pdf.addImage(imgData, 'JPEG', margin, margin, printWidth, printHeight);
      } else {
        const scale = (pageHeight - (margin * 2)) / printHeight;
        const scaledWidth = printWidth * scale;
        const scaledHeight = printHeight * scale;
        const offsetX = (pageWidth - scaledWidth) / 2;
        pdf.addImage(imgData, 'JPEG', offsetX, margin, scaledWidth, scaledHeight);
      }

      // Also copy pass/bill image to clipboard silently so user can paste directly in chat if desired
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          canvas.toBlob(blob => {
            if (blob) {
              navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).catch(() => {});
            }
          }, 'image/png');
        }
      } catch (e) {}

      if (autoDownload) {
        pdf.save(filename);
      }

      return pdf;
    }

    // Main Render
    // Welcome screen: shown after logout and to fresh visitors. Signing in
    // with a registered Gmail restores that role's own dashboard.
    function renderWelcomeScreen() {
      return `
        <div class="card" style="text-align:center;padding:24px 16px">
          ${getLoginBrandHeaderHtml()}
          <div style="margin-top:10px">
            ${getLoginControlsHtml('w_')}
          </div>
        </div>
      `;
    }

    function R() {
      syncBrandingConstants();
      const authPill = $('auth-status-pill');
      if (authPill) {
        if (currentUser && !currentUser.isGuest) {
          const isOwner = currentUser.role === 'owner';
          authPill.innerHTML = `<span class="pill ${isOwner ? 'g' : 'm'}" style="font-size:10.5px;padding:3px 7px;cursor:pointer" onclick="openTeamModal()">${isOwner ? '👑 ' : ''}${esc((currentUser.email||'').split('@')[0])}</span>`;
        } else {
          authPill.innerHTML = `<button class="btn pri s" onclick="loginWithGoogle()" style="padding:4px 8px;font-size:11px;min-height:0;border-radius:10px;white-space:nowrap">🔑 Sign in</button>`;
        }
      }

      const sel = $('trip-sel');
      const editTripBtn = $('trip-edit-btn');
      if (D.trips.length === 0) {
        sel.innerHTML = `<option value="">+ New Departure...</option>`;
        if (editTripBtn) editTripBtn.style.display = 'none';
      } else {
        sel.innerHTML = [...D.trips].sort((a,b)=>b.s.localeCompare(a.s)).map(t => `
          <option value="${t.id}" ${t.id === S.trip ? 'selected' : ''}>${esc(t.n)} (${dt(t.s)})</option>
        `).join('') + `<option value="__new__">+ New Departure...</option>`;
        if (editTripBtn) editTripBtn.style.display = 'inline-flex';
      }

      const dep = getActiveDeployment();
      const isTrialExpired = dep.licenseStatus === 'expired' || (dep.trialEndsAt && dep.trialEndsAt < TODAY);
      const showWelcome = !!(currentUser && currentUser.isGuest) && !(isTrialExpired && currentUser.email.toLowerCase() !== DEVELOPER_ADMIN_EMAIL);
      if (isTrialExpired && (!currentUser || currentUser.email.toLowerCase() !== DEVELOPER_ADMIN_EMAIL)) {
        $('m').innerHTML = VIEWS.company[0]();
      } else if (showWelcome) {
        $('m').innerHTML = renderWelcomeScreen();
      } else {
        const activeViews = VIEWS[S.mode];
        const activeTabFn = activeViews[S.tab] || activeViews[0];
        $('m').innerHTML = activeTabFn();
      }

      if (showWelcome) {
        $('nv').innerHTML = '';
      } else {
        const activeTabs = getModeTabs()[S.mode];
        $('nv').innerHTML = activeTabs.map((t, i) => `
          <button class="${i === S.tab ? 'a' : ''}" onclick="setTab(${i})">
            <b>${t[0]}</b>${t[1]}
          </button>
        `).join('');
      }
    }

    function setTab(i) {
      S.tab = i;
      R();
      $('m').scrollTop = 0;
    }

    function moveWidget(idx, dir) {
      const enabledList = WIDGET_CONFIG.filter(w => w.enabled);
      const target = idx + dir;
      if (target < 0 || target >= enabledList.length) return;
      const itemA = enabledList[idx];
      const itemB = enabledList[target];
      const idxA = WIDGET_CONFIG.indexOf(itemA);
      const idxB = WIDGET_CONFIG.indexOf(itemB);
      WIDGET_CONFIG[idxA] = itemB;
      WIDGET_CONFIG[idxB] = itemA;
      saveWidgetConfig();
      R();
    }

    function toggleWidgetSize(idx) {
      const enabledList = WIDGET_CONFIG.filter(w => w.enabled);
      const item = enabledList[idx];
      if (item) {
        item.full = !item.full;
        saveWidgetConfig();
        R();
      }
    }

    // Modal Helpers
    function openM(title, bodyHtml) {
      $('sheet').innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>${title}</h2>
          <button class="icon-btn" onclick="closeM()" style="width:28px;height:28px;font-size:12px">✕</button>
        </div>
        ${bodyHtml}
      `;
      $('ov').classList.add('on');
    }
    function closeM() {
      if (window.activeQrScanner) {
        try {
          window.activeQrScanner.stop().catch(() => {}).finally(() => {
            window.activeQrScanner = null;
          });
        } catch(e) {
          window.activeQrScanner = null;
        }
      }
      $('ov').classList.remove('on');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

    function toast(m) {
      const t = $('toast');
      t.textContent = m;
      t.style.display = 'block';
      clearTimeout(toast.h);
      toast.h = setTimeout(() => t.style.display = 'none', 3000);
    }

    // Modals
    function openNewTrip() {
      openM('Create Tour Departure', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:11.5px">Tour Name *</label><input id="tn" placeholder="e.g. Manali to Kashmir Expedition"></div>
          <div><label class="m" style="font-size:11.5px">Destination</label><input id="td" placeholder="e.g. Kashmir"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:11.5px">Start Date</label><input id="ts" type="date" value="${TODAY}"></div>
            <div style="flex:1"><label class="m" style="font-size:11.5px">End Date</label><input id="te" type="date" value="${TODAY}"></div>
          </div>
          <p id="t_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveNewTrip()">Create Departure</button>
        </div>
      `);
    }

    function saveNewTrip() {
      const n = $('tn').value.trim();
      if (!n) { $('t_err').textContent = 'Trip name is required.'; return; }
      const id = 't' + Date.now();
      const s = $('ts').value || TODAY;
      const e = $('te').value || s;
      if (e < s) { $('t_err').textContent = 'End date cannot be earlier than start date.'; return; }
      const tripDoc = { id, companyId: CURRENT_COMPANY_ID, n, dest: $('td').value.trim() || 'Tour', s, e, st: 'Open', deleted: false, createdAt: typeof firebase !== 'undefined' ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString() };
      D.trips.unshift(tripDoc);
      persist();
      S.trip = id;
      if (fbDb && CURRENT_COMPANY_ID) {
        fbDb.collection('companies').doc(CURRENT_COMPANY_ID).collection('trips').doc(id).set(tripDoc).catch(e => console.warn(e));
      }
      closeM();
      R();
      toast('New departure created.');
    }

    function openEditTrip(tripId) {
      const targetId = tripId || S.trip;
      const t = tr(targetId);
      if (!t) {
        openNewTrip();
        return;
      }
      const statuses = ['Open', 'In Progress', 'Completed', 'Cancelled'];
      openM('Edit Tour Departure', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div>
            <label class="m" style="font-size:11.5px">Tour Name *</label>
            <input id="et_n" value="${esc(t.n)}" placeholder="e.g. Manali to Kashmir Expedition">
          </div>
          <div style="display:flex;gap:8px">
            <div style="flex:1.2">
              <label class="m" style="font-size:11.5px">Destination *</label>
              <input id="et_d" value="${esc(t.dest || '')}" placeholder="e.g. Kashmir">
            </div>
            <div style="flex:0.8">
              <label class="m" style="font-size:11.5px">Status</label>
              <select id="et_st">
                ${statuses.map(st => `<option value="${st}" ${(t.st || 'Open') === st ? 'selected' : ''}>${st}</option>`).join('')}
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <div style="flex:1">
              <label class="m" style="font-size:11.5px">Start Date *</label>
              <input id="et_s" type="date" value="${esc(t.s || TODAY)}">
            </div>
            <div style="flex:1">
              <label class="m" style="font-size:11.5px">End Date *</label>
              <input id="et_e" type="date" value="${esc(t.e || t.s || TODAY)}">
            </div>
          </div>
          <p id="et_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveEditTrip('${t.id}')">Save Trip Changes</button>
          <button class="btn sec" style="color:var(--rd)" onclick="deleteTrip('${t.id}')">Delete Departure</button>
        </div>
      `);
    }

    function saveEditTrip(tripId) {
      const t = tr(tripId);
      if (!t) return;
      const n = $('et_n').value.trim();
      const dest = $('et_d').value.trim() || 'Tour';
      const s = $('et_s').value || TODAY;
      const e = $('et_e').value || s;
      const st = $('et_st') ? $('et_st').value : (t.st || 'Open');
      const err = $('et_err');

      if (!n) {
        err.textContent = 'Tour name is required.';
        return;
      }
      if (e < s) {
        err.textContent = 'End date cannot be earlier than start date.';
        return;
      }

      t.n = n;
      t.dest = dest;
      t.s = s;
      t.e = e;
      t.st = st;
      t.companyId = CURRENT_COMPANY_ID;

      persist();
      if (fbDb && CURRENT_COMPANY_ID) {
        fbDb.collection('companies').doc(CURRENT_COMPANY_ID).collection('trips').doc(tripId).update({
          n, dest, s, e, st, companyId: CURRENT_COMPANY_ID, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(e => console.warn(e));
      }
      closeM();
      R();
      toast('Tour departure details updated!');
    }

    function deleteTrip(tripId) {
      const t = tr(tripId);
      if (!t) return;
      const enrCount = D.enr.filter(e => e.t === tripId).length;
      openM('Delete Tour Departure', `

    // ================= SCREENSHOT OCR AUTO-UTR READER =================
    window._pendingPayProof = null;

    function extractUtrAndDetailsFromText(rawText) {
      const text = String(rawText || '').replace(/\r/g, '\n');
      let utr = '';
      let amount = null;
      let mode = null;

      // 1. Check explicit UTR / UPI Ref / Transaction ID patterns (PhonePe, GPay, Paytm, IMPS, NEFT)
      const labelPatterns = [
        /(?:UTR|U\.T\.R\.?)[\s:#.\-]*([A-Z0-9]{10,22})/i,
        /UPI\s*(?:transaction\s*ID|Ref\.?\s*No\.?|Ref\s*ID|ID)[\s:#.\-]*([0-9]{12})/i,
        /(?:Transaction\s*ID|Txn\s*ID|Ref\.?\s*No\.?|Reference\s*(?:No|ID))[\s:#.\-]*([A-Z0-9]{10,22})/i,
        /IMPS\s*(?:Ref\.?\s*No\.?)?[\s:#.\-]*([0-9]{12})/i
      ];

      for (const rx of labelPatterns) {
        const m = text.match(rx);
        if (m && m[1]) {
          const candidate = m[1].trim().toUpperCase();
          if (/\d{6,}/.test(candidate)) {
            utr = candidate.startsWith('UTR') || !/^\d{12}$/.test(candidate) ? candidate : 'UTR' + candidate;
            break;
          }
        }
      }

      // 2. Fallback: Any standalone 12-digit numeric UPI RRN/UTR in the text
      if (!utr) {
        const twelveDigitMatches = text.match(/\b(\d{12})\b/g);
        if (twelveDigitMatches && twelveDigitMatches.length > 0) {
          utr = 'UTR' + twelveDigitMatches[0];
        } else {
          // Sometimes OCR puts a space inside a 12-digit UTR (e.g. "4281 9037 4612" or "428190 374612")
          const splitMatch = text.match(/(?:UTR|Ref|ID|UPI)[^\d\n]{0,15}(\d{4,6}[\s]+\d{6,8})/i);
          if (splitMatch && splitMatch[1]) {
            const joined = splitMatch[1].replace(/\s+/g, '');
            if (joined.length >= 10 && joined.length <= 16) {
              utr = 'UTR' + joined;
            }
          }
        }
      }

      // 3. Detect Amount (₹ or Rs or INR)
      const amtMatch = text.match(/(?:₹|Rs\.?|INR)\s*([0-9]{1,3}(?:,[0-9]{2,3})+(?:\.[0-9]{1,2})?|[0-9]{3,7}(?:\.[0-9]{1,2})?)/i);
      if (amtMatch && amtMatch[1]) {
        const parsed = parseFloat(amtMatch[1].replace(/,/g, ''));
        if (parsed > 0 && parsed <= 500000) {
          amount = parsed;
        }
      }

      // 4. Detect Payment Mode
      if (/PhonePe|Google\s*Pay|GPay|Paytm|BHIM|UPI/i.test(text)) {
        mode = 'UPI';
      } else if (/IMPS|NEFT|RTGS|Bank\s*Transfer/i.test(text)) {
        mode = 'Bank transfer';
      }

      return { utr, amount, mode };
    }

    async function scanPaymentScreenshot(file, prefix = 'p', maxDuePaise = 0) {
      if (!file) return;
      const statusEl = $(prefix + '_ocr_status');
      const previewWrap = $(prefix + '_shot_preview_wrap');
      const previewImg = $(prefix + '_shot_preview');
      const utrInput = $(prefix + '_utr');
      const amtInput = $(prefix + '_amt');
      const mthInput = $(prefix + '_mth');

      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.style.color = 'var(--cy)';
        statusEl.innerHTML = '⏳ Reading payment screenshot...';
      }

      try {
        // Read & compress image for proof thumbnail + OCR canvas
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = dataUrl;
        });

        // Create compressed thumbnail (max 480px) so localStorage / Firestore stays lightweight
        const thumbCanvas = document.createElement('canvas');
        const maxDim = 480;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        thumbCanvas.width = Math.round(img.width * scale);
        thumbCanvas.height = Math.round(img.height * scale);
        const tCtx = thumbCanvas.getContext('2d');
        tCtx.drawImage(img, 0, 0, thumbCanvas.width, thumbCanvas.height);
        window._pendingPayProof = thumbCanvas.toDataURL('image/jpeg', 0.72);

        if (previewImg && previewWrap) {
          previewImg.src = window._pendingPayProof;
          previewWrap.style.display = 'flex';
        }

        // Run Tesseract OCR if available
        let extractedText = '';
        if (typeof Tesseract !== 'undefined') {
          const result = await Tesseract.recognize(dataUrl, 'eng', {
            logger: m => {
              if (m.status === 'recognizing text' && statusEl) {
                const pct = Math.round((m.progress || 0) * 100);
                statusEl.innerHTML = `🔍 Scanning screenshot for UTR... <b>${pct}%</b>`;
              }
            }
          });
          extractedText = (result && result.data && result.data.text) ? result.data.text : '';
        }

        // Also check filename in case the screenshot filename contains a 12-digit number
        const combinedSource = extractedText + '\n' + (file.name || '');
        const parsed = extractUtrAndDetailsFromText(combinedSource);

        if (parsed.utr) {
          if (utrInput) utrInput.value = parsed.utr;
          if (parsed.amount && amtInput && !amtInput.value) {
            const maxRupees = maxDuePaise > 0 ? Math.round(maxDuePaise / 100) : parsed.amount;
            amtInput.value = Math.min(parsed.amount, maxRupees);
          }
          if (parsed.mode && mthInput) {
            mthInput.value = parsed.mode;
          }
          if (statusEl) {
            statusEl.style.color = 'var(--gr)';
            statusEl.innerHTML = `✓ Auto-detected UTR: <b>${esc(parsed.utr)}</b>${parsed.amount ? ` • ₹${parsed.amount.toLocaleString('en-IN')}` : ''} (Saved for Excel)`;
          }
          toast('✓ UTR ' + parsed.utr + ' auto-extracted from screenshot!');
        } else {
          if (statusEl) {
            statusEl.style.color = 'var(--am)';
            statusEl.innerHTML = '⚠️ Screenshot attached! Could not auto-detect a 12-digit UTR — please type or verify UTR below.';
          }
          if (utrInput) utrInput.focus();
        }
      } catch (err) {
        console.warn('Screenshot OCR error:', err);
        if (statusEl) {
          statusEl.style.color = 'var(--am)';
          statusEl.innerHTML = '⚠️ Screenshot attached. Please enter or verify the UTR number below.';
        }
      }
    }

    // Generate a realistic sample UPI payment screenshot and run it through the exact OCR / UTR extractor

    async function savePay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const a = Math.round(parseFloat($('p_amt').value) * 100);
      const err = $('pay_err');
      if (!(a > 0)) { err.textContent = 'Enter an amount greater than 0.'; return; }
      if (a > due(e)) { err.textContent = `Overpayment blocked: remaining balance is ${inr(due(e))}.`; return; }

      const payDate = $('p_dt').value || TODAY;
      const utrVal = ($('p_utr') ? $('p_utr').value.trim().toUpperCase() : '');
      const payId = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const payEntry = {
        id: payId,
        paymentId: payId,
        companyId: CURRENT_COMPANY_ID,
        enrId: enrId,
        customerId: e.c,
        tripId: e.t,
        d: payDate,
        a: a,
        m: $('p_mth').value,
        utr: utrVal || '',
        proof: window._pendingPayProof || '',
        deleted: false,
        createdAt: typeof firebase !== 'undefined' ? firebase.firestore.FieldValue.serverTimestamp() : new Date().toISOString()
      };
      window._pendingPayProof = null;

      if (fbDb && CURRENT_COMPANY_ID && fbAuth && fbAuth.currentUser) {
        try {
          await fbDb.runTransaction(async tx => {
            // Per-company UTR unique duplicate check (Point 5)
            if (utrVal) {
              const dupQuery = await fbDb.collection('companies').doc(CURRENT_COMPANY_ID)
                .collection('payments')
                .where('companyId', '==', CURRENT_COMPANY_ID)
                .where('utr', '==', utrVal)
                .where('deleted', '==', false)
                .get();
              if (!dupQuery.empty) {
                throw new Error(`UTR "${utrVal}" has already been used in this company.`);
              }
            }
            const payRef = fbDb.collection('companies').doc(CURRENT_COMPANY_ID).collection('payments').doc(payId);
            tx.set(payRef, payEntry);
          });
          e.pay = e.pay || [];
          e.pay.push(payEntry);
          persist();
          closeM();
          R();
          toast(utrVal ? `Payment & UTR (${utrVal}) recorded!` : 'Payment recorded.');
        } catch(tErr) {
          if (err) err.textContent = tErr.message || 'Payment transaction failed.';
          toast(tErr.message || 'Error recording payment.');
        }
      } else {
        if (utrVal) {
          const exists = D.enr.some(en => (en.pay || []).some(p => !p.deleted && p.utr && p.utr.toUpperCase() === utrVal));
          if (exists) {
            if (err) err.textContent = `UTR "${utrVal}" has already been used in this company.`;
            return;
          }
        }
        e.pay = e.pay || [];
        e.pay.push(payEntry);
        persist();
        closeM();
        R();
        toast(utrVal ? `Payment & UTR (${utrVal}) recorded!` : 'Payment recorded.');
      }
    }

    async function saveEditedPayment(enrId, pIdx) {
      const e = D.enr.find(x => x.id === enrId);
      const a = Math.round(parseFloat($('ed_amt').value) * 100);
      if (!(a > 0)) return;
      const payItem = e.pay[pIdx];
      const payId = payItem.paymentId || payItem.id;
      const utrVal = ($('ed_utr') ? $('ed_utr').value.trim().toUpperCase() : '');
      const payDate = $('ed_d').value || TODAY;
      const modeVal = $('ed_mth').value;

      if (fbDb && CURRENT_COMPANY_ID && payId && fbAuth && fbAuth.currentUser) {
        try {
          await fbDb.runTransaction(async tx => {
            if (utrVal) {
              const dupQuery = await fbDb.collection('companies').doc(CURRENT_COMPANY_ID)
                .collection('payments')
                .where('companyId', '==', CURRENT_COMPANY_ID)
                .where('utr', '==', utrVal)
                .where('deleted', '==', false)
                .get();
              const duplicates = dupQuery.docs.filter(d => d.id !== payId);
              if (duplicates.length > 0) {
                throw new Error(`UTR "${utrVal}" has already been used in this company.`);
              }
            }
            const payRef = fbDb.collection('companies').doc(CURRENT_COMPANY_ID).collection('payments').doc(payId);
            tx.update(payRef, {
              a: a, m: modeVal, d: payDate, utr: utrVal, companyId: CURRENT_COMPANY_ID,
              ...(window._pendingPayProof ? { proof: window._pendingPayProof } : {}),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          });
        } catch(err) {
          toast(err.message || 'Error updating payment.');
          return;
        }
      }

      payItem.a = a;
      payItem.m = modeVal;
      payItem.d = payDate;
      payItem.utr = utrVal;
      if (window._pendingPayProof) payItem.proof = window._pendingPayProof;
      window._pendingPayProof = null;
      persist();
      closeM();
      R();
      toast('Payment updated.');
    }
