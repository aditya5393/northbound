<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NorthBound - Travel & Tour Management</title>
  <meta name="theme-color" content="#121316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #0c101c;
      --card: rgba(22, 32, 56, 0.88);
      --card-solid: #162038;
      --tx: #ffffff;
      --mut: #91a2bf;
      --line: rgba(255, 255, 255, 0.12);
      --cy: #00f2d5;
      --bl: #3898ff;
      --gr: #2ed573;
      --rd: #ff4757;
      --am: #ffa502;
      --pu: #9b51e0;
      --ac: #00f2d5;
      --ac2: #3898ff;
      --gx: 50%;
      --gy: 25%;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 14.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #gemini-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(750px circle at var(--gx) var(--gy), rgba(56, 152, 255, 0.15), rgba(155, 81, 224, 0.12), transparent 65%),
        radial-gradient(circle at 10% 15%, rgba(0, 242, 213, 0.08), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(155, 81, 224, 0.10), transparent 50%),
        #0c101c;
    }

    #app {
      max-width: 440px;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      margin: auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    /* iOS Glassmorphic Header */
    header#top-bar {
      padding: max(12px, env(safe-area-inset-top, 12px)) 16px 12px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(12, 16, 28, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }
    .brand-logo i {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--bl), var(--gr));
      display: grid;
      place-items: center;
      color: #fff;
      font-style: normal;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(56, 152, 255, 0.35);
    }

    .trip-pill-select {
      flex: 1;
      max-width: 170px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      color: var(--tx);
      font-size: 12px;
      font-weight: 600;
      border-radius: 14px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--tx);
      font-size: 17px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Main Scrollable Content Area */
    main#m {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 20px;
    }
    main#m::-webkit-scrollbar {
      width: 4px;
    }
    main#m::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* iOS Glassmorphic Cards */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* iOS Floating Bottom Dock Navigation */
    nav#nv {
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 0 10px max(10px, env(safe-area-inset-bottom, 10px));
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(17, 24, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 6px 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    nav#nv button {
      flex: 1;
      background: none;
      border: 0;
      color: #91a2bf;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
      border-radius: 18px;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    nav#nv button b {
      display: block;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.1;
      transition: transform 0.15s ease;
    }
    nav#nv button:active {
      transform: scale(0.92);
    }
    nav#nv button.a {
      color: #ffffff !important;
      background: color-mix(in srgb, var(--ac) 24%, #1d2842) !important;
      border: 1px solid color-mix(in srgb, var(--ac) 45%, transparent);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--ac) 28%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent);
    }
    nav#nv button.a b {
      filter: drop-shadow(0 0 6px var(--ac));
      transform: translateY(-1px);
    }

    /* iOS Metric Widgets */
    .ios-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: rgba(22, 32, 56, 0.75);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 88px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .kpi-lbl {
      color: var(--mut);
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .kpi-val {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: -0.5px;
    }
    .kpi-sub {
      color: var(--mut);
      font-size: 11px;
      margin-top: 2px;
    }

    /* Accent utilities */
    .g { color: var(--gr); }
    .r { color: var(--rd); }
    .m { color: var(--mut); }
    .a { color: var(--am); }
    .c { color: var(--cy); }

    .pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill.g { background: rgba(46, 213, 115, 0.15); border-color: rgba(46, 213, 115, 0.35); }
    .pill.r { background: rgba(255, 71, 87, 0.15); border-color: rgba(255, 71, 87, 0.35); }
    .pill.a { background: rgba(255, 165, 2, 0.15); border-color: rgba(255, 165, 2, 0.35); }

    /* Progress bar */
    .ios-bar {
      height: 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 8px 0;
    }
    .ios-bar b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cy), var(--bl));
      border-radius: 6px;
    }
    .ios-bar b.exp {
      background: linear-gradient(90deg, var(--am), var(--rd));
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border: 0;
    }

    /* iOS Buttons */
    .btn {
      width: 100%;
      min-height: 44px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn.pri {
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #061224;
      box-shadow: 0 4px 16px rgba(0, 242, 213, 0.35);
    }
    .btn.sec {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tx);
      border: 1px solid var(--line);
    }
    .btn.s {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12.5px;
      width: auto;
    }

    input, select {
      width: 100%;
      font: inherit;
      color: var(--tx);
      background: rgba(14, 20, 36, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 42px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus {
      border-color: var(--bl);
    }

    /* iOS Bottom Sheet Modal */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 20, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    .ov.on {
      display: flex;
    }
    .sheet {
      background: #151d30;
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 26px 26px 0 0;
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 10px));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: sheetUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      margin: 4px auto 14px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-head h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* Paper Receipt Styling */
    .paper {
      background: #ffffff;
      color: #0b1b33;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      position: relative;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .pr {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e3e9f2;
      font-size: 13.5px;
    }
    .stamp {
      position: absolute;
      right: 20px;
      bottom: 20px;
      border: 3.5px solid #15803d;
      color: #15803d;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.1em;
      padding: 2px 14px;
      border-radius: 8px;
      transform: rotate(-12deg);
      opacity: 0.9;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 84px;
      background: rgba(18, 26, 46, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 60;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
    }

    @media print {
      body * { visibility: hidden; }
      .paper, .paper * { visibility: visible; }
      .ov, .sheet { position: static; max-height: none; overflow: visible; background: transparent; border: 0; }
      .paper { page-break-after: always; box-shadow: none; }
    }
  </style>
</head>
<body>

  <!-- Ambient Dynamic Glow Background -->
  <div id="gemini-bg" aria-hidden="true"></div>

  <div id="app">
    <!-- Top iOS Bar -->
    <header id="top-bar">
      <div class="brand-logo">
        <i>N</i><span>NorthBound</span>
      </div>
      <select id="trip-sel" class="trip-pill-select" onchange="S.trip=this.value;S.open=S.enr=null;R()"></select>
      <button class="icon-btn" onclick="openSet()" aria-label="Settings">⚙️</button>
    </header>

    <!-- Scrollable Main View -->
    <main id="m"></main>

    <!-- Apple iOS Bottom Tab Bar -->
    <nav id="nv"></nav>
  </div>

  <!-- iOS Bottom Sheet Modal -->
  <div class="ov" id="ov" onclick="if(event.target===this)closeM()">
    <div class="sheet" id="sheet"></div>
  </div>

  <div id="toast"></div>

  <script>
    // Cursor/Touch interactive glow tracking
    (()=>{
      let x = innerWidth / 2, y = innerHeight * .25;
      const update = (px, py) => {
        document.documentElement.style.setProperty('--gx', px + 'px');
        document.documentElement.style.setProperty('--gy', py + 'px');
      };
      window.addEventListener('pointermove', e => update(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchmove', e => { if (e.touches[0]) update(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    })();

    const $ = id => document.getElementById(id);
    const sum = a => a.reduce((s, x) => s + x, 0);
    const R_AMT = n => n * 100;
    const TODAY = new Date().toISOString().slice(0, 10);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const inr = p => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(p / 100);
    const dt = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    const mon = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' });
    const P = (d, a, m, ref) => ({ d, a: R_AMT(a), m, ref });

    // Initial Data
    let D = {
      trips: [
        { id: 't0', n: 'Goa Beach Retreat', dest: 'Goa', s: '2025-12-10', e: '2025-12-14', st: 'Completed' },
        { id: 't1', n: 'Spiti Valley Expedition', dest: 'Spiti, Himachal Pradesh', s: '2026-09-05', e: '2026-09-12', st: 'Completed' },
        { id: 't2', n: 'Rajasthan Heritage Tour', dest: 'Jaipur to Udaipur', s: '2026-11-14', e: '2026-11-20', st: 'Open' }
      ],
      cust: [
        { id: 'c1', n: 'Aarav Mehta', ph: '+91 98765 43210' },
        { id: 'c2', n: 'Priya Nair', ph: '+91 99887 76655' },
        { id: 'c3', n: 'Rohan Kulkarni', ph: '+91 98200 11223' },
        { id: 'c4', n: 'Ananya Iyer', ph: '+91 97310 55667' }
      ],
      enr: [
        { id: 'e1', c: 'c1', t: 't0', price: R_AMT(28000), disc: 0, pay: [P('2025-11-02', 28000, 'UPI', 'UPI-3301')] },
        { id: 'e2', c: 'c2', t: 't0', price: R_AMT(28000), disc: 0, pay: [P('2025-11-05', 20000, 'UPI', 'UPI-3350')] },
        { id: 'e3', c: 'c1', t: 't1', price: R_AMT(45000), disc: 0, pay: [P('2026-08-02', 20000, 'UPI', 'UPI-4821'), P('2026-08-20', 25000, 'Bank transfer', 'NEFT-7730')] },
        { id: 'e4', c: 'c2', t: 't1', price: R_AMT(45000), disc: R_AMT(2000), pay: [P('2026-08-05', 22000, 'UPI', 'UPI-5102')] },
        { id: 'e5', c: 'c1', t: 't2', price: R_AMT(38000), disc: 0, pay: [P('2026-09-15', 15000, 'UPI', 'UPI-6644')] },
        { id: 'e6', c: 'c3', t: 't2', price: R_AMT(38000), disc: 0, pay: [P('2026-10-06', 38000, 'Cash', 'CASH-31')] },
        { id: 'e7', c: 'c4', t: 't2', price: R_AMT(38000), disc: R_AMT(3000), pay: [P('2026-09-18', 35000, 'Card', 'CARD-9981')] },
        { id: 'e8', c: 'c2', t: 't2', price: R_AMT(38000), disc: 0, pay: [] }
      ],
      exp: [
        { t: 't0', cat: 'Hotels', v: 'Palm Resort', a: R_AMT(40000), d: '2025-12-01' },
        { t: 't0', cat: 'Vehicles', v: 'Goa Cabs', a: R_AMT(12000), d: '2025-12-08' },
        { t: 't1', cat: 'Vehicles', v: 'Himalayan Cabs', a: R_AMT(28000), d: '2026-09-04' },
        { t: 't1', cat: 'Hotels', v: 'Kaza Homestays', a: R_AMT(31000), d: '2026-09-05' },
        { t: 't1', cat: 'Camps', v: 'Chandratal Camp', a: R_AMT(9000), d: '2026-09-08' },
        { t: 't2', cat: 'Hotels', v: 'Heritage Haveli', a: R_AMT(30000), d: '2026-10-02' },
        { t: 't2', cat: 'Vehicles', v: 'Marwar Travels', a: R_AMT(18000), d: '2026-10-05' }
      ]
    };

    try {
      const saved = localStorage.getItem('nb_data');
      if (saved) D = JSON.parse(saved);
    } catch(e) {}
    const persist = () => { try { localStorage.setItem('nb_data', JSON.stringify(D)); } catch(e) {} };

    // State
    const S = { tab: 0, trip: 't2', open: null, enr: null, q: '' };

    const net = e => sum(e.pay.map(p => p.a));
    const rev = e => e.price - e.disc;
    const due = e => rev(e) - net(e);
    const cu = id => D.cust.find(c => c.id === id);
    const tr = id => D.trips.find(t => t.id === id);
    const no = e => 'NB-' + tr(e.t).s.slice(0, 4) + '-' + String(D.enr.indexOf(e) + 1).padStart(4, '0');

    const tot = t => {
      const es = D.enr.filter(e => e.t === t);
      const ex = D.exp.filter(x => x.t === t);
      const rv = sum(es.map(rev));
      const got = sum(es.map(net));
      const inv = sum(ex.map(x => x.a));
      return { es, ex, rv, got, inv, due: rv - got, pl: rv - inv };
    };

    const pill = (x, c) => `<span class="pill ${c}">${x}</span>`;
    const stat = e => due(e) === 0 ? pill('Paid', 'g') : net(e) === 0 ? pill('Unpaid', 'r') : pill('Partial', 'a');

    // Bottom Navigation Tabs
    const TABS = [
      ['🏠', 'Home'],
      ['👥', 'Enrolled'],
      ['💳', 'Billing'],
      ['🚐', 'Expenses'],
      ['🧾', 'Bills'],
      ['📅', 'History']
    ];

    // Views
    const VIEWS = [
      // 0: HOME
      () => {
        const t = tr(S.trip), T = tot(S.trip);
        return `
          <div class="card" style="padding:14px;background:linear-gradient(135deg,rgba(56,152,255,0.18),rgba(0,242,213,0.12));border-color:rgba(56,152,255,0.3)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <span class="pill g">${t.st}</span>
              <span class="m" style="font-size:12px">${dt(t.s)} to ${dt(t.e)}</span>
            </div>
            <h1 style="font-size:20px;font-weight:800;letter-spacing:-0.4px">${esc(t.n)}</h1>
            <div class="m" style="font-size:12.5px;margin-top:2px">📍 ${esc(t.dest)}</div>
          </div>

          <div class="ios-grid">
            <div class="kpi-box">
              <div class="kpi-lbl">Enrolled</div>
              <div class="kpi-val">${T.es.length} <span style="font-size:14px;color:var(--mut)">people</span></div>
              <div class="kpi-sub">${T.es.filter(e=>due(e)===0).length} paid in full</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-lbl">Collected</div>
              <div class="kpi-val g">${inr(T.got)}</div>
              <div class="kpi-sub">Due: <b class="a">${inr(T.due)}</b></div>
            </div>
            <div class="kpi-box">
              <div class="kpi-lbl">Expenses</div>
              <div class="kpi-val">${inr(T.inv)}</div>
              <div class="kpi-sub">${T.ex.length} entries</div>
            </div>
            <div class="kpi-box">

          <div class="card">

              <span style="font-size:13px">Customer Revenue: <b>${inr(T.rv)}</b></span>

            <div class="row" style="padding:6px 0 0;border:0">
              <span style="font-size:13px">Trip Expenses: <b class="r">${inr(T.inv)}</b></span>

      },

      // 1: ENROLLED
      () => {
        const T = tot(S.trip);
        const q = (S.q || '').toLowerCase();
        const list = T.es.filter(e => {
          const c = cu(e.c);
          return (c.n + c.ph).toLowerCase().includes(q);
        });

        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

              <h1 style="font-size:20px;font-weight:800">Enrolled People</h1>

                ${o ? `
                  <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
                    <div style="font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px">Payment History (${e.pay.length})</div>
                    ${e.pay.map(p => `
                      <div class="row" style="padding:4px 0;font-size:12px">
                        <span>${dt(p.d)} • ${p.m} ${p.ref ? `(${p.ref})` : ''}</span>
                        <b class="g">+${inr(p.a)}</b>

              </div>
            `;
          }).join('') || '<div class="card m" style="text-align:center">No travelers match your search.</div>'}
        `;
      },

      // 2: BILLING & COLLECTIONS
      () => {
        const T = tot(S.trip);
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div>
              <h1 style="font-size:20px;font-weight:800">Collection &amp; Billing</h1>
              <div class="m" style="font-size:12px">Collected ${inr(T.got)} of ${inr(T.rv)}</div>
            </div>
          </div>

          ${T.es.map(e => {
            const c = cu(e.c), o = S.enr === e.id, pc = Math.round(net(e) / rev(e) * 100);
            return `
              <div class="card">
                <div class="row" style="padding-top:0">
                  <div>
                    <b style="font-size:15px">${esc(c.n)}</b>
                    <div class="m" style="font-size:12px">${c.ph}</div>
                  </div>
                  ${stat(e)}
                </div>
                <div class="ios-bar"><b style="width:${pc}%"></b></div>
                <div class="row" style="border:0;padding:4px 0;font-size:13px">
                  <span>Paid: <b class="g">${inr(net(e))}</b> (${pc}%)</span>
                  <span>Due: <b class="a">${inr(due(e))}</b></span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                  <span class="m" style="font-size:12px;cursor:pointer" onclick="S.enr=S.enr==='${e.id}'?null:'${e.id}';R()">
                    ${o ? '▲ Hide payments' : `▼ View ${e.pay.length} payment${e.pay.length === 1 ? '' : 's'}`}
                  </span>
                  ${due(e) > 0 ? `
                    <button class="btn pri s" onclick="openPay('${e.id}')">+ Collect Payment</button>
                  ` : `<span class="pill g" style="font-size:10.5px">✓ Settled</span>`}
                </div>

                ${o ? `
                  <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
                    ${e.pay.map(p => `
                      <div class="row" style="padding:4px 0;font-size:12px">
                        <div><b>${p.m}</b> <span class="m">${dt(p.d)}</span></div>
                        <b class="g">+${inr(p.a)}</b>
                      </div>
                    `).join('') || '<div class="m" style="font-size:12px">No transactions yet.</div>'}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('') || '<div class="card m" style="text-align:center">No one enrolled on this trip yet.</div>'}
        `;
      },

      // 3: EXPENSES
      () => {
        const ex = tot(S.trip).ex, cats = ['Hotels', 'Vehicles', 'Camps', 'Food', 'Other facilities'];
        const totalExp = sum(ex.map(x => x.a));
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div>
              <h1 style="font-size:20px;font-weight:800">Trip Expenses</h1>
              <div class="m" style="font-size:12px">Total Spent: <b class="r">${inr(totalExp)}</b></div>
            </div>
            <button class="btn pri s" onclick="openExpense()">+ Add Expense</button>
          </div>

          <div class="ios-grid">
            ${cats.map(c => `
              <div class="kpi-box" style="min-height:76px">
                <div class="kpi-lbl">${c}</div>
                <div class="kpi-val" style="font-size:18px">${inr(sum(ex.filter(x => x.cat === c).map(x => x.a)))}</div>
              </div>
            `).join('')}
          </div>

          <div class="card">
            <div style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Logged Transactions</div>
            ${ex.map(x => `
              <div class="row">
                <div>
                  <b style="font-size:14px">${x.cat}</b> • ${esc(x.v)}
                  <div class="m" style="font-size:11.5px">${dt(x.d)}</div>
                </div>
                <b class="r">${inr(x.a)}</b>
              </div>
            `).join('') || '<div class="m" style="font-size:12px">No expenses recorded for this trip yet.</div>'}
          </div>
        `;
      },

      // 4: BILLS & RECEIPTS
      () => {
        const paid = tot(S.trip).es.filter(e => due(e) === 0);
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div>
              <h1 style="font-size:20px;font-weight:800">Bills &amp; Receipts</h1>
              <div class="m" style="font-size:12px">${paid.length} fully paid travelers</div>
            </div>
            <button class="btn sec s" onclick="printAll()">Print Preview</button>
          </div>

          <div class="card" style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b>Select All Paid Customers</b>
              <input type="checkbox" onchange="document.querySelectorAll('.pk-sel').forEach(c=>c.checked=this.checked)">
            </div>
          </div>

          ${paid.map(e => {
            const c = cu(e.c);
            return `
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                  <div>
                    <b style="font-size:15px">${esc(c.n)}</b>
                    <div class="m" style="font-size:12px">${c.ph}</div>
                    <div class="g" style="font-size:13px;margin-top:4px">Paid: <b>${inr(net(e))}</b></div>
                  </div>
                  <input class="pk-sel" type="checkbox" value="${e.id}" style="width:20px;height:20px;accent-color:var(--ac)">
                </div>
                <div style="display:flex;gap:8px;margin-top:10px">
                  <button class="btn pri s" style="flex:1" onclick="downloadPdf('${e.id}')">Download PDF</button>
                  <button class="btn sec s" style="flex:1" onclick="previewSingle('${e.id}')">Preview Bill</button>
                </div>
              </div>
            `;
          }).join('') || '<div class="card m" style="text-align:center">No travelers have settled their full dues yet.</div>'}
        `;
      },

      // 5: HISTORY
      () => {
        const ys = {};
        D.trips.forEach(t => (ys[t.s.slice(0, 4)] = ys[t.s.slice(0, 4)] || []).push(t));
        return `
          <div style="margin-bottom:12px">
            <h1 style="font-size:20px;font-weight:800">All Trips History</h1>
            <div class="m" style="font-size:12px">${D.trips.length} tours organized</div>
          </div>

          ${Object.keys(ys).sort().reverse().map(y => {
            const T = ys[y].map(t => ({ t, ...tot(t.id) }));
            const s = k => sum(T.map(x => x[k]));
            return `
              <div class="card">
                <div class="row" style="padding-top:0">
                  <b style="font-size:18px">${y}</b>
                  <b class="${s('pl') < 0 ? 'r' : 'g'}">${s('pl') < 0 ? 'Loss' : 'Profit'} ${inr(Math.abs(s('pl')))}</b>
                </div>
                <div class="m" style="font-size:11.5px;margin-bottom:8px">
                  Spent ${inr(s('inv'))} • Revenue ${inr(s('rv'))} • Pending ${inr(s('due'))}
                </div>
                ${T.map(x => `
                  <div class="row" style="cursor:pointer" onclick="S.trip='${x.t.id}';S.tab=0;R()">
                    <div>
                      <b style="font-size:14px">${esc(x.t.n)}</b>
                      <div class="m" style="font-size:11.5px">${mon(x.t.s)} • ${x.es.length} people</div>
                    </div>
                    <b class="${x.pl < 0 ? 'r' : 'g'}">${inr(x.pl)}</b>
                  </div>
                `).join('')}
              </div>
            `;
          }).join('')}
        `;
      }
    ];

    // Main Render function
    function R() {
      // Update trip select
      $('trip-sel').innerHTML = [...D.trips].sort((a,b)=>b.s.localeCompare(a.s)).map(t => `
        <option value="${t.id}" ${t.id === S.trip ? 'selected' : ''}>${esc(t.n)}</option>
      `).join('') + `<option value="__new__">+ New Trip...</option>`;

      // Render Active View
      $('m').innerHTML = VIEWS[S.tab]();

      // Render iOS Bottom Dock
      $('nv').innerHTML = TABS.map((t, i) => `
        <button class="${i === S.tab ? 'a' : ''}" onclick="setTab(${i})">
          <b>${t[0]}</b>${t[1]}
        </button>
      `).join('');
    }

    function setTab(i) {
      S.tab = i;
      R();
      $('m').scrollTop = 0;
    }

    // Modal Helpers
    function openM(title, bodyHtml) {
      $('sheet').innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <h2>${title}</h2>
          <button class="icon-btn" onclick="closeM()" style="width:30px;height:30px;font-size:13px">✕</button>
        </div>
        ${bodyHtml}
      `;
      $('ov').classList.add('on');
    }
    function closeM() { $('ov').classList.remove('on'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

    function toast(m) {
      const t = $('toast');
      t.textContent = m;
      t.style.display = 'block';
      clearTimeout(toast.h);
      toast.h = setTimeout(() => t.style.display = 'none', 3000);
    }

    // Trip selector event
    $('trip-sel').addEventListener('change', function() {
      if (this.value === '__new__') {
        openNewTrip();
        this.value = S.trip;
      }
    });

    // Modals
    function openNewTrip() {
      openM('Create New Trip', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:12px">Trip Name *</label><input id="tn" placeholder="e.g. Leh Ladakh Bike Tour"></div>
          <div><label class="m" style="font-size:12px">Destination</label><input id="td" placeholder="e.g. Ladakh"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:12px">Start Date</label><input id="ts" type="date" value="${TODAY}"></div>
            <div style="flex:1"><label class="m" style="font-size:12px">End Date</label><input id="te" type="date" value="${TODAY}"></div>
          </div>
          <p id="t_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveNewTrip()">Create Tour</button>
        </div>
      `);
    }

    function saveNewTrip() {
      const n = $('tn').value.trim();
      if (!n) { $('t_err').textContent = 'Trip name is required.'; return; }
      const id = 't' + Date.now();
      const s = $('ts').value || TODAY;
      const e = $('te').value || s;
      D.trips.unshift({ id, n, dest: $('td').value.trim() || 'Tour', s, e, st: 'Open' });
      persist();
      S.trip = id;
      closeM();
      R();
      toast('Trip created successfully.');
    }

    function openEnroll() {
      openM('Enroll Person', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div><label class="m" style="font-size:12px">Full Name *</label><input id="pn" placeholder="Traveler Name"></div>
          <div><label class="m" style="font-size:12px">10-Digit Mobile *</label><input id="pp" type="tel" placeholder="e.g. 9876543210"></div>
          <div style="display:flex;gap:8px">
            <div style="flex:1"><label class="m" style="font-size:12px">Price (₹) *</label><input id="pb" type="number" placeholder="45000"></div>
            <div style="flex:1"><label class="m" style="font-size:12px">Discount (₹)</label><input id="pd" type="number" placeholder="0" value="0"></div>
          </div>
          <p id="p_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveEnroll()">Save &amp; Enroll</button>
        </div>
      `);
    }

    function saveEnroll() {
      const n = $('pn').value.trim();
      const d = $('pp').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
      const b = Math.round(parseFloat($('pb').value) * 100);
      const x = Math.round((parseFloat($('pd').value) || 0) * 100);
      const err = $('p_err');

      if (!n) { err.textContent = 'Please enter traveler name.'; return; }
      if (!/^[6-9]\d{9}$/.test(d)) { err.textContent = 'Enter a valid 10-digit Indian mobile number.'; return; }
      if (!(b > 0)) { err.textContent = 'Booking price must be greater than zero.'; return; }
      if (x < 0 || x >= b) { err.textContent = 'Discount must be less than the price.'; return; }

      let c = D.cust.find(c => c.ph.replace(/\D/g, '').slice(-10) === d);
      if (!c) {
        c = { id: 'c' + Date.now(), n, ph: '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) };
        D.cust.push(c);
      }
      if (D.enr.some(z => z.c === c.id && z.t === S.trip)) {
        err.textContent = c.n + ' is already enrolled on this trip.';
        return;
      }
      D.enr.push({ id: 'e' + Date.now(), c: c.id, t: S.trip, price: b, disc: x, pay: [] });
      persist();
      closeM();
      R();
      toast('Customer enrolled successfully.');
    }

    function openPay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c);
      openM('Record Payment', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="m" style="font-size:12.5px">${esc(c.n)} • Remaining Due: <b class="a">${inr(due(e))}</b></div>
          <div><label class="m" style="font-size:12px">Amount in ₹ *</label><input id="p_amt" type="number" placeholder="Enter amount"></div>
          <div>
            <label class="m" style="font-size:12px">Payment Mode</label>
            <select id="p_mth">
              <option>UPI</option>
              <option>Cash</option>
              <option>Bank transfer</option>
              <option>Card</option>
            </select>
          </div>
          <div><label class="m" style="font-size:12px">Reference / UTR</label><input id="p_ref" placeholder="e.g. UPI-1234"></div>
          <p id="pay_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="savePay('${enrId}')">Record Payment</button>
        </div>
      `);
    }

    function savePay(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const a = Math.round(parseFloat($('p_amt').value) * 100);
      const err = $('pay_err');
      if (!(a > 0)) { err.textContent = 'Enter an amount greater than 0.'; return; }
      if (a > due(e)) { err.textContent = `Overpayment blocked: remaining balance is ${inr(due(e))}.`; return; }

      e.pay.push({ d: TODAY, a, m: $('p_mth').value, ref: $('p_ref').value.trim() || 'PAY-' + (e.pay.length + 1) });
      persist();
      closeM();
      R();
      toast('Payment recorded in ledger.');
    }

    function openExpense() {
      openM('Add Trip Expense', `
        <div style="display:flex;flex-direction:column;gap:10px">
          <div>
            <label class="m" style="font-size:12px">Category</label>
            <select id="x_cat">
              <option>Hotels</option>
              <option>Vehicles</option>
              <option>Camps</option>
              <option>Food</option>
              <option>Other facilities</option>
            </select>
          </div>
          <div><label class="m" style="font-size:12px">Vendor Name</label><input id="x_ven" placeholder="e.g. Mountain Resort / Cabs"></div>
          <div><label class="m" style="font-size:12px">Amount in ₹ *</label><input id="x_amt" type="number" placeholder="Enter amount"></div>
          <p id="x_err" class="r" style="font-size:12px"></p>
          <button class="btn pri" onclick="saveExpense()">Save Expense</button>
        </div>
      `);
    }

    function saveExpense() {
      const a = Math.round(parseFloat($('x_amt').value) * 100);
      const v = $('x_ven').value.trim();
      const err = $('x_err');
      if (!v || !(a > 0)) { err.textContent = 'Please enter vendor and amount.'; return; }

      D.exp.push({ t: S.trip, cat: $('x_cat').value, v, a, d: TODAY });
      persist();
      closeM();
      R();
      toast('Expense recorded.');
    }

    function openSet() {
      openM('Settings', `
        <div class="card" style="padding:12px">
          <div class="m" style="font-size:11px;font-weight:700;text-transform:uppercase">Company &amp; Backup</div>
          <div style="margin-top:10px;display:flex;gap:8px">
            <button class="btn pri s" style="flex:1" onclick="exportData()">Download JSON</button>
            <label class="btn sec s" style="flex:1;text-align:center">
              Restore JSON
              <input type="file" accept=".json" hidden onchange="importData(this.files[0])">
            </label>
          </div>
        </div>
        <div class="card" style="padding:12px;margin-top:8px">
          <div class="m" style="font-size:11px;font-weight:700;text-transform:uppercase">Theme Mode</div>
          <div style="margin-top:8px;display:flex;gap:8px">
            <button class="btn sec s" style="flex:1" onclick="document.body.style.background='#0c101c';toast('Dark navy active')">Dark Navy</button>
            <button class="btn sec s" style="flex:1" onclick="document.body.style.background='#141416';toast('OLED Black active')">OLED Black</button>
          </div>
        </div>
      `);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'northbound-backup-' + TODAY + '.json';
      a.click();
      toast('Backup file saved.');
    }

    function importData(f) {
      if (!f) return;
      f.text().then(t => {
        try {
          const d = JSON.parse(t);
          if (d && Array.isArray(d.trips)) {
            D = d;
            persist();
            S.trip = D.trips[0].id;
            closeM();
            R();
            toast('Backup restored successfully.');
          }
        } catch(e) {
          toast('Invalid JSON backup file.');
        }
      });
    }

    // PDF Bill/Receipt Generator
    function previewSingle(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const c = cu(e.c), t = tr(e.t), ok = due(e) === 0;
      openM(ok ? 'Paid-in-Full Receipt' : 'Booking Statement', `
        <div class="paper">
          <div style="display:flex;justify-content:space-between;border-bottom:2px solid #0b1b33;padding-bottom:8px">
            <div><b style="font-size:18px">NorthBound</b><br><small>Travel &amp; Tours</small></div>
            <div style="text-align:right"><b>${ok ? 'RECEIPT' : 'STATEMENT'}</b><br><small>${no(e)}</small></div>
          </div>
          <p style="margin:10px 0 6px"><b>${esc(c.n)}</b> (${c.ph})<br>${esc(t.n)} • ${esc(t.dest)}</p>
          <div class="pr"><span>Booking Price</span><b>${inr(e.price)}</b></div>
          <div class="pr"><span>Discount</span><b>-${inr(e.disc)}</b></div>
          <div class="pr"><span>Total Paid</span><b class="g">${inr(net(e))}</b></div>
          <div class="pr" style="font-size:15px"><b>Remaining Balance</b><b class="${due(e) > 0 ? 'a' : 'g'}">${inr(due(e))}</b></div>
          ${ok ? '<div class="stamp">PAID</div>' : ''}
        </div>
        <button class="btn pri" onclick="window.print()">Print Receipt</button>
      `);
    }

    function downloadPdf(enrId) {
      const e = D.enr.find(x => x.id === enrId);
      const J = window.jspdf && window.jspdf.jsPDF;
      if (!J) { toast('PDF generator not available.'); return; }
      const d = new J({ unit: 'mm', format: 'a4' });
      const c = cu(e.c), t = tr(e.t), dd = due(e), ok = dd === 0;

      d.setFillColor(11, 27, 51);
      d.rect(0, 0, 210, 28, 'F');
      d.setTextColor(255);
      d.setFontSize(20);
      d.setFont('helvetica', 'bold');
      d.text('NorthBound', 14, 18);
      d.setFontSize(11);
      d.text(ok ? 'PAID-IN-FULL RECEIPT' : 'BOOKING STATEMENT', 196, 13, { align: 'right' });
      d.text(no(e), 196, 21, { align: 'right' });

      d.setTextColor(11, 27, 51);
      d.setFontSize(14);
      d.text(c.n, 14, 42);
      d.setFont('helvetica', 'normal');
      d.setFontSize(10);
      d.text(c.ph, 14, 48);
      d.text(t.n + ' - ' + t.dest, 14, 56);
      d.text(dt(t.s) + ' to ' + dt(t.e), 14, 62);

      let y = 76;
      [['Package Price', e.price], ['Discount', e.disc], ['Payments Received', net(e)], ['Remaining Due', dd]].forEach(([l, v], j) => {
        d.setFont('helvetica', j === 3 ? 'bold' : 'normal');
        d.text(l, 14, y);
        d.text('INR ' + (v/100).toLocaleString('en-IN'), 196, y, { align: 'right' });
        d.setDrawColor(200);
        d.line(14, y + 2, 196, y + 2);
        y += 10;
      });

      if (ok) {
        d.setTextColor(21, 128, 61);
        d.setFont('helvetica', 'bold');
        d.setFontSize(44);
        d.text('PAID', 128, y + 36, { angle: 14 });
      }

      d.save(`NorthBound-${c.n.replace(/\s+/g, '_')}-Receipt.pdf`);
      toast('PDF receipt downloaded.');
    }

    function printAll() {
      window.print();
    }

    // Init
    R();
  </script>
</body>
</html>
